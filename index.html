/* a tipped book sweeps h*sin(theta) sideways at its head. reserve exactly that
   much margin so it leans into empty air instead of across its neighbour. */
function fixLeans(){
  document.querySelectorAll(".book.lean").forEach(function(b){
    const row = b.closest(".row");
    const rowH = row ? row.getBoundingClientRect().height : 0;
    if (!rowH) return;
    const tilt = Math.abs(parseFloat(b.dataset.tilt) || 0);
    const hpx = rowH * (parseFloat(b.dataset.h) || 0) / 100;
    b.style.marginRight = Math.ceil(hpx * Math.sin(tilt * Math.PI/180) + 3) + "px";
  });
}

function measureMainWidth(){
  const kids = rowMain.children;
  if (!kids.length) return 0;
  const cs = getComputedStyle(rowMain);
  const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const first = kids[0].getBoundingClientRect();
  const last = kids[kids.length-1].getBoundingClientRect();
  return Math.ceil((last.right - first.left) + pad);
}

function fillDeco(node, targetW, scale){
  const seqs = [SEQ_A, SEQ_B, SEQ_C, SEQ_D, SEQ_E];
  simpleMode = true;
  heightScale = scale || 1;
  let i = 0;
  while (node.scrollWidth < targetW + 400 && i < 40){
    runSeq(node, seqs[(i + (node.id === "rowLower" ? 2 : 0)) % seqs.length]);
    i++;
  }
  heightScale = 1;
  simpleMode = false;
}

function fairyLights(host, width, o){
  o = o || {};
  const seg = o.seg || 158, sag = o.sag || 28, top = o.top || 4;
  const wrap = document.createElement("div");
  wrap.className = "lights";
  wrap.style.width = width + "px";
  let d = "M0," + top;
  const bulbs = [];
  for (let x=0; x<width; x+=seg){
    const x2 = Math.min(x+seg, width), span = x2 - x;
    d += " Q" + r2((x+x2)/2) + "," + r2(top+sag) + " " + r2(x2) + "," + top;
    [.28,.5,.72].forEach(function(t){ bulbs.push({x:x + span*t, y: top + 2*(1-t)*t*sag}); });
    bulbs.push({x:x2, y:top});
  }
  let h = '<svg width="' + width + '" height="' + (top+sag+6) + '" aria-hidden="true">'
        + '<path d="' + d + '" fill="none" stroke="rgba(88,68,42,.75)" stroke-width="1"/></svg>';
  bulbs.forEach(function(b,i){
    const big = i % 3 === 0;
    h += '<span class="bulb' + (big ? " big" : "") + '" style="left:' + r2(b.x) + 'px;top:' + r2(b.y) + 'px;'
       + (big ? 'animation-delay:' + r2((i*0.41) % 5) + 's' : '') + '"></span>';
  });
  wrap.innerHTML = h;
  host.appendChild(wrap);
}

function addKnots(board, width){
  for (let x = between(160, 700); x < width - 100; x += between(620, 1500)){
    const k = document.createElement("span");
    k.className = "knot";
    const w = between(14, 34);
    k.style.left = r2(x) + "px";
    k.style.width = r2(w) + "px";
    k.style.height = r2(w * between(.3,.55)) + "px";
    k.style.top = r2(between(12, 48)) + "%";
    board.appendChild(k);
  }
}

const panelEls = [];

/* The panels span the whole case, but the copy inside is nudged onto the centre
   line of the main shelf and, if it is still taller than the cavity, scaled down
   until it fits — so the type never crosses the boards above or below it. */
function centrePanelCopy(){
  const caseR = caseEl.getBoundingClientRect();
  const mainR = document.getElementById("rowMainWrap").getBoundingClientRect();
  const panelCentre = caseR.height / 2;
  const mainCentre = (mainR.top - caseR.top) + mainR.height / 2;
  const shift = r2(mainCentre - panelCentre);
  /* leave a little air so descenders never touch the shelf edge */
  const avail = Math.max(80, mainR.height - 34);

  /* the slanted note appears only when the box actually overflows, and
     retires once the reader reaches the end */
  panelEls.forEach(function(p){
    p.querySelectorAll(".v-scroll-wrap").forEach(function(wrap){
      const box = wrap.querySelector(".v-scroll");
      if (!box) return;
      const more = box.scrollHeight > box.clientHeight + 4;
      wrap.classList.toggle("can-scroll", more);
      if (!box.dataset.wired){
        box.dataset.wired = "1";
        box.addEventListener("scroll", function(){
          const end = box.scrollTop + box.clientHeight >= box.scrollHeight - 6;
          wrap.classList.toggle("at-end", end);
        }, {passive:true});

        /* the arrow advances a screenful, and returns to the top once there
           is nothing left below */
        const more = wrap.querySelector(".scroll-hint");
        if (more){
          more.addEventListener("click", function(e){
            e.stopPropagation();
            const end = box.scrollTop + box.clientHeight >= box.scrollHeight - 6;
            box.scrollTo({top: end ? 0 : box.scrollTop + box.clientHeight * 0.8,
                          behavior: REDUCE ? "auto" : "smooth"});
          });
        }
      }
    });
  });

  panelEls.forEach(function(p){
    const copy = p.firstElementChild;
    copy.style.setProperty("--shift", shift + "px");
    /* offsetHeight is the pre-transform layout height, so measuring it does not
       compound with a scale left over from the previous pass */
    const natural = copy.offsetHeight;
    const fitH = natural > avail ? Math.max(.55, avail / natural) : 1;
    /* and the same test across: if the block could ever reach past the open
       space, it is scaled until it cannot */
    const room = p.clientWidth;
    const wide = copy.scrollWidth;
    const fitW = (room && wide > room) ? Math.max(.5, room / wide) : 1;
    copy.style.setProperty("--fit", r2(Math.min(fitH, fitW)));
  });
}

function buildPanels(){
  const caseR = caseEl.getBoundingClientRect();
  const blocked = [];
  document.querySelectorAll(".nook").forEach(function(n){
    const r = n.getBoundingClientRect();
    blocked.push([r.left - caseR.left - 40, r.right - caseR.left + 40]);
  });
  document.querySelectorAll("[data-slot]").forEach(function(s){
    const r = s.getBoundingClientRect();
    const left = r.left - caseR.left;
    blocked.push([left - 30, left + r.width + 30]);
    const spec = PANELS[s.dataset.slot];
    /* hold the copy back from the edges of the gap: whatever it contains, it
       can never reach the books standing on either side */
    const inset = Math.min(130, Math.max(28, r.width * 0.10));
    const p = document.createElement("div");
    p.className = "panel " + spec.cls;
    p.style.left = r2(left + inset) + "px";
    p.style.width = r2(Math.max(160, r.width - inset * 2)) + "px";
    p.innerHTML = '<div class="v-copy">' + spec.html + '</div>';
    caseEl.appendChild(p);
    panelEls.push(p);
  });
  return blocked;
}

function addUprights(width, blocked){
  const step = 1180;
  for (let x = step; x < width - 200; x += step * between(.82, 1.24)){
    let hit = false;
    for (let i=0;i<blocked.length;i++){
      if (x > blocked[i][0] - 30 && x < blocked[i][1] + 30){ hit = true; break; }
    }
    if (hit) continue;
    const u = document.createElement("div");
    u.className = "upright";
    u.style.left = r2(x) + "px";
    caseEl.appendChild(u);
  }
}

function decorate(width){
  if (decorated) return;
  decorated = true;

  fillDeco(document.getElementById("rowUpper"), width, 1.45);
  fillDeco(document.getElementById("rowLower"), width);

  addKnots(document.getElementById("boardA"), width);
  addKnots(document.getElementById("boardB"), width);

  /* lights hang from the underside of a board, so only the middle shelf gets them */
  fairyLights(document.getElementById("rowMainWrap"), width, {seg:158, sag:28, top:4});

  const blocked = buildPanels();
  addUprights(width, blocked);

  [0.19, 0.51, 0.84].forEach(function(p){
    const d = document.createElement("div");
    d.className = "fore-book";
    d.style.left = r2(p * width) + "px";
    fore.appendChild(d);
  });
  fore.style.width = width + "px";
}

function layout(){
  vw = window.innerWidth;
  caseEl.style.width = "max-content";
  fixLeans();
  W = measureMainWidth();
  caseEl.style.width = W + "px";
  decorate(W);
  centrePanelCopy();
  maxX = Math.max(0, W - vw);
  cacheAnchors();
  buildRailMarks();
  tx = clamp(tx, 0, maxX); x = clamp(x, 0, maxX);
  railW = rail.clientWidth;
  thumbW = Math.max(26, (vw / Math.max(W,1)) * railW);
  railThumb.style.width = thumbW + "px";
  lastX = NaN;
  apply();
}

/* ============================================================
   6 — MOTION
   ============================================================ */
let x = 0, tx = 0, vel = 0, dragging = false, lastPX = 0, moved = 0, tween = null, engaged = false;
const isTouchLayout = () => window.innerWidth < 900;

let railW = 0, thumbW = 26, lastX = NaN;

function apply(){
  track.style.transform = "translate3d(" + (-x) + "px,0,0)";
  wall.style.transform = "translate3d(" + (-x * 0.34) + "px,0,0)";
  fore.style.transform = "translate3d(" + (-x * 1.14) + "px,0,0)";
  const p = maxX ? x / maxX : 0;
  railThumb.style.left = (p * (railW - thumbW)) + "px";
  updateNavState();
}
function frame(){
  if (tween){
    const t = clamp((performance.now() - tween.start) / tween.dur, 0, 1);
    const e = t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
    tx = tween.from + (tween.to - tween.from) * e;
    if (t >= 1) tween = null;
  }
  tx = clamp(tx, 0, maxX);
  const ease = REDUCE ? 1 : (dragging ? .42 : .2);
  x += (tx - x) * ease;
  /* settle at half a pixel: below that nothing is visible, and chasing it
     costs another twenty frames of painting */
  if (Math.abs(tx - x) < .5) x = tx;
  /* Only touch the DOM when the view has actually moved. Standing still, the
     frame costs a few comparisons and the browser paints nothing at all. */
  if (x !== lastX){ lastX = x; apply(); }
  requestAnimationFrame(frame);
}
function engage(){ if (engaged) return; engaged = true; hint.classList.add("gone"); rail.classList.add("on"); }
function nudge(d){ engage(); tween = null; tx = clamp(tx + d, 0, maxX); }
function glideTo(target, dur){
  engage();
  tween = {from:tx, to:clamp(target,0,maxX), start:performance.now(), dur: REDUCE ? 1 : (dur || 1250)};
}
function centerOn(el, dur){
  const r = el.getBoundingClientRect(), t = track.getBoundingClientRect();
  glideTo((r.left - t.left) + r.width/2 - vw/2, dur);
}

stage.addEventListener("wheel", function(e){
  if (isOverlayOpen()) return;

  const dx = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  if (!dx) return;
  e.preventDefault();
  engage(); tween = null;
  /* a notch should cover useful ground on a shelf thousands of pixels long */
  tx = clamp(tx + dx * (e.deltaMode === 1 ? 34 : 2), 0, maxX);
}, {passive:false});

/* Pointer capture retargets the click event to the capturing element, which
   swallows clicks on anything inside the stage — nooks, the hero button, the
   contact links. So capture is only taken once a real drag is under way; a
   plain tap never captures and reaches its button normally. */
let captured = false;
stage.addEventListener("pointerdown", function(e){
  if (isOverlayOpen() || e.button !== 0) return;
  dragging = true; moved = 0; vel = 0; tween = null; captured = false;
  lastPX = e.clientX;
});
stage.addEventListener("pointermove", function(e){
  if (!dragging) return;
  const d = e.clientX - lastPX;
  lastPX = e.clientX; moved += Math.abs(d);
  if (moved > 4){
    engage();
    if (!captured){
      captured = true;
      stage.classList.add("dragging");
      try{ stage.setPointerCapture(e.pointerId); }catch(_){}
    }
  }
  if (!captured) return;
  vel = vel * .6 + d * .4;
  tx = clamp(tx - d, 0, maxX);
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  stage.classList.remove("dragging");
  if (captured){
    try{ stage.releasePointerCapture(e.pointerId); }catch(_){}
    if (!REDUCE) tx = clamp(tx - vel * 11, 0, maxX);
    if (isTouchLayout()) snap();
  }
  captured = false;
}
stage.addEventListener("pointerup", endDrag);
stage.addEventListener("pointercancel", endDrag);
stage.addEventListener("click", function(e){
  if (moved > 6){ e.preventDefault(); e.stopPropagation(); moved = 0; }
}, true);

window.addEventListener("keydown", function(e){
  if (isOverlayOpen()){ if (e.key === "Escape") closeProject(); return; }
  if (e.key === "Escape" && bubbleOpen){ closeBubble(true); return; }
  /* typing in the recommendation slip: arrows, Home/End and paging belong
     to the text field, not to walking the shelf */
  if (e.target.closest && e.target.closest("#brandBubble")) return;
  if (e.key === "Escape" && menuOpen){ closeMenu(true); return; }
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  if (e.key === "ArrowRight"){ nudge(vw*.55); e.preventDefault(); }
  else if (e.key === "ArrowLeft"){ nudge(-vw*.55); e.preventDefault(); }
  else if (e.key === "Home"){ glideTo(0); e.preventDefault(); }
  else if (e.key === "End"){ glideTo(maxX); e.preventDefault(); }
  else if (e.key === "PageDown" && tag !== "BUTTON"){ nudge(vw*.9); e.preventDefault(); }
  else if (e.key === "PageUp" && tag !== "BUTTON"){ nudge(-vw*.9); e.preventDefault(); }
});
document.addEventListener("focusin", function(e){
  const t = e.target;
  if (!t.closest || !t.closest("#stage") || isOverlayOpen()) return;
  const r = t.getBoundingClientRect();
  if (r.left < 80 || r.right > vw - 80) centerOn(t, 700);
});

const ANCH = {};
let ANCH_LIST = [];
function cacheAnchors(){
  const trackR = track.getBoundingClientRect();
  ANCH_LIST = [];
  Array.prototype.forEach.call(document.querySelectorAll("[data-anchor]"), function(el){
    const r = el.getBoundingClientRect();
    const pos = clamp((r.left - trackR.left) + r.width/2 - vw/2, 0, maxX);
    ANCH[el.dataset.anchor] = pos;
    ANCH_LIST.push({key:el.dataset.anchor, pos:pos});
  });
  ANCH.home = 0;
  /* the Work nav item lands on the first project on the shelf */
  ANCH.work = ANCH[ORDER[0]];
}
function snap(){
  const list = ANCH_LIST.map(a => a.pos).concat([0, maxX]);
  let best = tx, dist = Infinity;
  list.forEach(function(v){ const d = Math.abs(v-tx); if (d < dist){ dist = d; best = v; } });
  glideTo(best, 800);
}
function targetFor(key){
  if (key === "home") return 0;
  if (key === "resume") return null;
  return typeof ANCH[key] === "number" ? ANCH[key] : 0;
}
/* the hero call to action takes the visitor onto the shelf itself, landing on
   the first project — the nav menu is for going straight to a named one */
document.addEventListener("click", function(e){
  if (e.target.closest("[data-browse]")){
    /* straight to the first project on the shelf */
    const first = ORDER[0];
    if (typeof ANCH[first] === "number") glideTo(ANCH[first]);
    return;
  }
  const btn = e.target.closest("[data-go]");
  if (!btn) return;
  const key = btn.dataset.go;
  closeBubble(false);
  if (key === "resume"){ glideTo(targetFor("about")); return; }
  const t = targetFor(key);
  if (t !== null) glideTo(t);
});

let navLinks = null, lastActive = null, lastNearest = null;
function updateNavState(){
  if (!navLinks) navLinks = document.querySelectorAll(".nav-link");
  if (typeof ANCH.work !== "number") return;

  /* nearest project to the centre of the view, for the menu's current marker */
  let nearest = null, best = Infinity;
  ORDER.forEach(function(id){
    const d = Math.abs(ANCH[id] - x);
    if (d < best){ best = d; nearest = id; }
  });

  if (nearest !== lastNearest){
    lastNearest = nearest;
    syncMenuCurrent(best < vw * 0.75 ? nearest : null);
  }

  let active = "";
  if (x >= ANCH.contact - 340) active = "contact";
  else if (x >= ANCH.about - 340) active = "about";
  else if (x >= ANCH.work - 460) active = "work";
  if (active === lastActive) return;
  lastActive = active;
  navLinks.forEach(function(l){
    if (l.dataset.go === active || (active === "work" && l.id === "workBtn")) l.setAttribute("aria-current","true");
    else l.removeAttribute("aria-current");
  });
}
function railLabel(key){
  if (key === "home") return "Start";
  if (PROJECTS[key]) return PROJECTS[key].name;
  return key.charAt(0).toUpperCase() + key.slice(1);
}
function buildRailMarks(){
  rail.querySelectorAll(".rail-mark").forEach(n => n.remove());
  if (!maxX) return;
  ANCH_LIST.forEach(function(a){
    const label = railLabel(a.key);
    const m = document.createElement("button");
    m.className = "rail-mark" + (PROJECTS[a.key] ? " project" : "");
    m.type = "button";
    m.setAttribute("aria-label", "Jump to " + label);
    m.style.left = ((a.pos / maxX) * 100) + "%";
    m.innerHTML = '<span class="lbl">' + label + '</span>';
    m.addEventListener("click", function(){ glideTo(a.pos); });
    rail.appendChild(m);
  });
}

/* ============================================================
   6b — JUMP MENU
   A direct index of every project, so nobody has to travel the
   whole shelf to reach the last one. Built from ORDER + PROJECTS.
   ============================================================ */
const workBtn = document.getElementById("workBtn");
const workMenu = document.getElementById("workMenu");
let menuOpen = false;

function buildMenu(){
  let h = '<p class="menu-head">Jump to a project</p>';
  ORDER.forEach(function(id, i){
    const p = PROJECTS[id];
    h += '<button class="menu-item" type="button" role="menuitem" data-jump="' + id + '">'
       + '<span class="menu-text"><span class="menu-name">' + p.name + '</span>'
       + '<span class="menu-sub">' + p.sub + '</span></span></button>';
  });
  workMenu.innerHTML = h;
}

function menuItems(){
  return Array.prototype.slice.call(workMenu.querySelectorAll("[data-jump]"));
}
function openMenu(focusFirst){
  if (menuOpen) return;
  menuOpen = true;
  workMenu.hidden = false;
  workBtn.setAttribute("aria-expanded", "true");
  if (focusFirst) menuItems()[0].focus();
}
function closeMenu(returnFocus){
  if (!menuOpen) return;
  menuOpen = false;
  workMenu.hidden = true;
  workBtn.setAttribute("aria-expanded", "false");
  if (returnFocus) workBtn.focus();
}

workBtn.addEventListener("click", function(e){
  e.stopPropagation();
  closeBubble(false);
  if (menuOpen) closeMenu(false); else openMenu(false);
});

/* ---- the avatar says hello ---- */
const brandBtn = document.getElementById("avatar");
const brandBubble = document.getElementById("brandBubble");
let bubbleOpen = false;

function openBubble(){
  if (bubbleOpen) return;
  closeMenu(false);
  bubbleOpen = true;
  brandBubble.hidden = false;
  /* unhide first, then animate on the next frame */
  requestAnimationFrame(function(){ brandBubble.classList.add("open"); });
  brandBtn.setAttribute("aria-expanded", "true");
}
function closeBubble(returnFocus){
  if (!bubbleOpen) return;
  bubbleOpen = false;
  brandBubble.classList.remove("open");
  brandBtn.setAttribute("aria-expanded", "false");
  setTimeout(function(){
    if (bubbleOpen) return;
    brandBubble.hidden = true;
    /* after a thank-you, the next visit finds a fresh slip */
    if (!recDone.hidden) resetRec();
  }, 300);
  if (returnFocus) brandBtn.focus();
}

/* ---- the recommendation slip ----------------------------------------------
   Where recommendations go. Leave RECOMMEND_ENDPOINT empty and the slip
   still plays its thank-you but sends nothing anywhere. Set it to a form
   endpoint (Formspree, Getform, a serverless function...) that accepts a
   JSON POST of {book, note} and each one is delivered there.              */
const RECOMMEND_ENDPOINT = "";
const recForm = document.getElementById("recForm");
const recBook = document.getElementById("recBook");
const recNote = document.getElementById("recNote");
const recDone = document.getElementById("recDone");

function sendRecommendation(rec){
  if (!RECOMMEND_ENDPOINT) return Promise.resolve();
  return fetch(RECOMMEND_ENDPOINT, {
    method:"POST",
    headers:{"Content-Type":"application/json", "Accept":"application/json"},
    body:JSON.stringify(rec)
  }).catch(function(){});
}
function resetRec(){
  recForm.reset();
  recForm.classList.remove("leaving");
  recForm.hidden = false;
  recDone.hidden = true;
  recDone.classList.remove("play");
}
recBook.addEventListener("animationend", function(){ recBook.classList.remove("need"); });
recBook.addEventListener("input", function(){ recBook.classList.remove("need"); });
recForm.addEventListener("submit", function(e){
  e.preventDefault();
  const book = recBook.value.trim();
  if (!book){
    recBook.classList.remove("need"); void recBook.offsetWidth;
    recBook.classList.add("need");
    recBook.focus();
    return;
  }
  sendRecommendation({book:book, note:recNote.value.trim()});
  /* ~1s: the slip fades (.22s), the new spine slides onto the little shelf,
     then the thank-you settles in underneath */
  const swap = function(){
    recForm.hidden = true;
    recDone.hidden = false;
    recDone.classList.add("play");
    brandBubble.focus({preventScroll:true});
  };
  if (REDUCE){ swap(); return; }
  recForm.classList.add("leaving");
  setTimeout(swap, 220);
});

brandBtn.addEventListener("click", function(e){
  e.stopPropagation();
  /* the glow has done its job once it has been noticed */
  if (brandBtn.parentElement) brandBtn.parentElement.classList.add("met");
  if (bubbleOpen) closeBubble(false); else openBubble();
});
brandBubble.addEventListener("click", function(e){ e.stopPropagation(); });
brandBubble.tabIndex = -1;
document.addEventListener("click", function(e){
  if (bubbleOpen && !e.target.closest(".brand-wrap")) closeBubble(false);
});
workBtn.addEventListener("keydown", function(e){
  if (e.key === "ArrowDown" || e.key === "Enter" || e.key === " "){
    e.preventDefault();
    openMenu(true);
  }
});
workMenu.addEventListener("click", function(e){
  const item = e.target.closest("[data-jump]");
  if (!item) return;
  glideTo(ANCH[item.dataset.jump]);
  closeMenu(false);
});
workMenu.addEventListener("keydown", function(e){
  const items = menuItems();
  const i = items.indexOf(document.activeElement);
  if (e.key === "ArrowDown"){ e.preventDefault(); items[(i+1) % items.length].focus(); }
  else if (e.key === "ArrowUp"){ e.preventDefault(); items[(i-1+items.length) % items.length].focus(); }
  else if (e.key === "Home"){ e.preventDefault(); items[0].focus(); }
  else if (e.key === "End"){ e.preventDefault(); items[items.length-1].focus(); }
  else if (e.key === "Escape"){ e.preventDefault(); closeMenu(true); }
  else if (e.key === "Tab") closeMenu(false);
});
document.addEventListener("click", function(e){
  if (menuOpen && !e.target.closest(".nav-item")) closeMenu(false);
});

/* mark the project the viewer is currently in front of */
function syncMenuCurrent(active){
  if (!workMenu.childElementCount) return;
  menuItems().forEach(function(it){
    if (it.dataset.jump === active) it.setAttribute("aria-current", "true");
    else it.removeAttribute("aria-current");
  });
}

/* ============================================================
   7 — CASE STUDY
   ============================================================ */
const overlay = document.getElementById("overlay");
const backBtn = document.getElementById("backBtn");
backBtn.addEventListener("click", closeProject);

let openBtn = null, openFrom = null;
/* true while the camera is travelling into a nook: the shelf stops taking
   input, but the case study is not on screen yet */
let dreaming = false;
const isOverlayOpen = () => !overlay.hidden || dreaming;
/* nooks that open by entering their own world rather than by expanding.
   tone: what the screen passes through on the way — white for a light case
   study, black for a dark one. back: whether leaving plays the entry in
   reverse (into the tone, then back out through the arch). */
const DREAM_CASES = {
  hydrabloom: {tone:"light", back:true},
  lantern:    {tone:"dark",  back:true}
};
/* the colour the veil reaches at the handoff */
const DREAM_TONE = {light:"#fff", dark:"#000"};

function caseHTML(id){
  if (CASE_BUILDERS[id]) return CASE_BUILDERS[id]();
  const p = PROJECTS[id];
  let secs = "";
  p.sections.forEach(function(s){
    secs += '<section class="cs-section"><h2>' + s[0] + '</h2><div>';
    for (let i=1;i<s.length;i++) if (s[i]) secs += '<p>' + s[i] + '</p>';
    secs += '</div></section>';
  });
  let meta = '<dl class="cs-meta">';
  p.meta.forEach(function(m){ meta += '<div><dt>' + m[0] + '</dt><dd>' + m[1] + '</dd></div>'; });
  meta += '</dl>';
  return '<div class="case-inner">' +
    '<header class="cs-hero">' + sceneMarkup(id, "hero") +
      '<div class="cs-head"><p class="cs-kicker">' + p.kicker + '</p>' +
      '<h1 class="cs-title" id="csTitle">' + p.name + '</h1>' +
      '<p class="cs-sub">' + p.sub + '</p></div></header>' +
    '<div class="cs-body">' + meta + '<div class="cs-hero-block">Project hero</div>' + secs +

/* ---- entering the nook ------------------------------------------------------
   click -> the scene travels out of the arch until it fills the screen ->
   its wash rises -> the screen reaches the case's tone (white or black) ->
   the case study is switched in underneath -> the tone lifts to reveal it.
   The shelf never moves and the case study is never scaled.                */

/* where the arch is right now (hover scale included), and the zoom that
   takes it past every edge of the screen, rounded top included */
function nookGeometry(btn){
  const arch = btn.querySelector(".nook-arch") || btn;
  const a = arch.getBoundingClientRect();
  const k = arch.offsetWidth ? a.width / arch.offsetWidth : 1;
  const rCss = parseFloat(getComputedStyle(arch).borderTopLeftRadius) || 0;
  const r0 = Math.min(rCss, arch.offsetWidth / 2) * k;
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  const S = Math.max(vw / a.width, vh / Math.max(1, a.height - 2 * r0)) * 1.06;
  return {arch, a, r0, vw, vh, S, W:a.width * S, H:a.height * S,
          dx:(a.left + a.width / 2) - vw / 2, dy:(a.top + a.height / 2) - vh / 2};
}

/* the zoom as keyframes, from the arch (u=0) to full screen (u=1). It grows
   geometrically about one fixed point on the nook, which reads as a camera
   moving at an even pace: scale S^(u-1), and the offset that keeps that
   point still, d * S/(S-1) * (1 - scale). Both are linear in scale, so the
   browser's interpolation between steps stays on the same path. */
function zoomSteps(g){
  const steps = [];
  for (let i = 0; i <= 12; i++){
    const sc = Math.pow(g.S, i / 12 - 1);
    const m = g.S / (g.S - 1) * (1 - sc);
    steps.push({opacity:1, transform:"translate3d(" + g.dx * m + "px," + g.dy * m + "px,0) scale(" + sc + ")"});
  }
  return steps;
}

/* a copy of the nook's scene, laid out at its FINAL full-screen size (so it
   is rasterised once, sharp) and shrunk by transform to sit on the arch.
   A picture is rebuilt from ART; a CSS scene is cloned from the live nook
   with its animations frozen at the same moment, so frame one matches. */
function travelLayer(id, btn, g, atArch){
  const travel = dreamLayer("nook-travel");
  travel.style.cssText = "left:" + (g.vw - g.W) / 2 + "px;top:" + (g.vh - g.H) / 2 + "px;"
    + "width:" + g.W + "px;height:" + g.H + "px;"
    + "border-radius:" + g.r0 * g.S + "px " + g.r0 * g.S + "px 0 0;opacity:0;"
    + "transform:" + (atArch ? "translate3d(" + g.dx + "px," + g.dy + "px,0) scale(" + (1 / g.S) + ")" : "none");
  const art = ART[id] || {};
  let freeze = function(){};
  if (art.nook){
    travel.innerHTML = artMarkup(art.nook, art.pos, art.crop);
  } else {
    const live = btn.querySelector(".nook-arch .scene");
    const copy = live.cloneNode(true);
    travel.appendChild(copy);
    /* only the scene's own looping animations are paired up; a hover
       transition running on the live nook has no twin in the copy */
    const loops = function(el){
      return el.getAnimations({subtree:true}).filter(function(an){ return an instanceof CSSAnimation; });
    };
    freeze = function(){
      const from = loops(live);
      loops(copy).forEach(function(an, i){
        if (from[i]) an.currentTime = from[i].currentTime;
        an.pause();
      });
    };
  }
  return {el:travel, freeze:freeze};
}

/* a full-screen layer for the transition; while up it swallows wheel and
   touch scrolling, so nothing underneath moves */
function dreamLayer(cls){
  const el = document.createElement("div");
  el.className = cls;
  el.setAttribute("aria-hidden", "true");
  const block = function(e){ e.preventDefault(); };
  el.addEventListener("wheel", block, {passive:false});
  el.addEventListener("touchmove", block, {passive:false});
  return el;
}

/* ready when a copied picture is decoded, so its first frame is never blank */
function travelReady(travel){
  const img = travel.querySelector("img");
  return (img && img.decode ? img.decode() : Promise.resolve()).catch(function(){});
}

const DREAM_EASE = "cubic-bezier(0.22, 1, 0.36, 1)";
const DREAM_TRAVEL = 850, DREAM_TONE_AT = 600, DREAM_TONE_IN = 420,
      DREAM_HOLD = 130, DREAM_LIFT = 540;

function enterNook(id, btn){
  const cfg = DREAM_CASES[id];
  const r = btn.getBoundingClientRect();
  openFrom = {l:r.left, t:r.top, w:r.width, h:r.height};
  openBtn = btn;
  dreaming = true;
  closeMenu(false);
  closeBubble(false);

  /* build the page now, still hidden, so its images load during the travel */
  overlay.innerHTML = caseHTML(id);
  wireArt(overlay, id);
  overlay.classList.toggle("light", !!LIGHT_CASES[id]);
  backBtn.classList.toggle("on-light", !!LIGHT_CASES[id]);

  /* put the case study on screen, full size, behind whatever covers it */
  const showCase = function(){
    overlay.classList.add("dream-in", "shown");
    overlay.hidden = false;
    overlay.scrollTop = 0;
    overlay.style.setProperty("--scroll", "0");
    wireHydra(overlay);
    const nav = document.querySelector(".nav");
    nav.style.opacity = "0";
    nav.style.pointerEvents = "none";
    stage.setAttribute("aria-hidden","true");
    backBtn.hidden = false;
  };
  const done = function(){
    overlay.classList.remove("dream-in");
    dreaming = false;
    backBtn.focus({preventScroll:true});
  };

  if (REDUCE){
    showCase();
    overlay.animate([{opacity:0}, {opacity:1}], {duration:300, easing:"ease"})
      .finished.catch(function(){}).then(done);
    return;
  }

  const g = nookGeometry(btn);
  const t = travelLayer(id, btn, g, true);
  const travel = t.el;
  const wash = dreamLayer("nook-wash" + (cfg.tone === "dark" ? " dark" : ""));
  const veil = dreamLayer("nook-veil");
  veil.style.background = DREAM_TONE[cfg.tone];
  document.body.appendChild(travel);
  document.body.appendChild(wash);
  document.body.appendChild(veil);
  t.freeze();

  const start = function(){
    /* the copy appears at full opacity exactly over the arch, then zooms */
    travel.animate(zoomSteps(g), {duration:DREAM_TRAVEL, easing:DREAM_EASE, fill:"forwards"});
    /* the scene's wash starts rising as it nears full screen */
    wash.animate([{opacity:0}, {opacity:0, offset:.45}, {opacity:1}],
      {duration:DREAM_TRAVEL, easing:"ease-in-out", fill:"forwards"});

    /* from 600ms the scene washes toward the tone over 420ms, overlapping
       the last of the zoom so it reads as one movement */
    veil.animate([{opacity:0}, {opacity:1}],
      {duration:DREAM_TONE_IN, delay:DREAM_TONE_AT, easing:"cubic-bezier(.45,0,.55,1)", fill:"forwards"})
      .finished.catch(function(){}).then(function(){
        /* only the tone is visible now: switch the page underneath it */
        const since = performance.now();
        travel.remove();
        wash.remove();
        showCase();
        /* two frames so the case study has painted, and at least HOLD ms of
           solid tone, before the veil starts to lift */
        requestAnimationFrame(function(){ requestAnimationFrame(function(){
          const wait = Math.max(0, DREAM_HOLD - (performance.now() - since));
          setTimeout(function(){
            veil.animate([{opacity:1}, {opacity:0}],
              {duration:DREAM_LIFT, easing:"cubic-bezier(.33,0,.2,1)", fill:"forwards"})
              .finished.catch(function(){}).then(function(){
                veil.remove();
                done();
              });
          }, wait);
        }); });
      });
  };
  travelReady(travel).then(function(){ requestAnimationFrame(start); });
}

/* ---- leaving a case study --------------------------------------------------
   the case study fades into its tone (white for a light case, black for a
   dark one) -> while the screen is solid, the page is put away and the shelf
   is back underneath -> the tone lifts and the bookshelf emerges from it.
   No nook artwork on the way back: the portal belongs to the way in.      */
function leaveNook(id, btn){
  const cfg = DREAM_CASES[id];
  dreaming = true;
  backBtn.hidden = true;
  const veil = dreamLayer("nook-veil");
  veil.style.background = DREAM_TONE[cfg.tone];
  document.body.appendChild(veil);

  veil.animate([{opacity:0}, {opacity:1}],
    {duration:DREAM_TONE_IN, easing:"cubic-bezier(.45,0,.55,1)", fill:"forwards"})
    .finished.catch(function(){}).then(function(){
      const since = performance.now();
      /* put the page away and the shelf back, all under solid tone */
      overlay.classList.remove("shown");
      overlay.hidden = true;
      overlay.innerHTML = "";
      hbDrift = [];
      overlay.classList.remove("light");
      backBtn.classList.remove("on-light");
      document.querySelector(".nav").style.opacity = "";
      document.querySelector(".nav").style.pointerEvents = "";
      stage.removeAttribute("aria-hidden");

      /* two frames so the shelf has painted, and a short hold of solid tone,
         before the veil lifts to reveal it */
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        const wait = Math.max(0, DREAM_HOLD - (performance.now() - since));
        setTimeout(function(){
          veil.animate([{opacity:1}, {opacity:0}],
            {duration:DREAM_LIFT, easing:"cubic-bezier(.33,0,.2,1)", fill:"forwards"})
            .finished.catch(function(){}).then(function(){
              veil.remove();
              dreaming = false;
              if (btn) btn.focus({preventScroll:true});
            });
        }, wait);
      }); });
    });
}

function closeProject(){
  if (!isOverlayOpen() || dreaming) return;
  const leaving = openBtn && openBtn.dataset.project;
  if (!REDUCE && leaving && DREAM_CASES[leaving] && DREAM_CASES[leaving].back){
    leaveNook(leaving, openBtn);
    return;
  }
  overlay.classList.remove("shown");
  backBtn.hidden = true;
  const btn = openBtn;
  /* the live rect is unusable while the stage is scaled away, so the geometry
     captured on the way in is what we return to */
  const r = openFrom;
  const finish = function(){
    overlay.hidden = true;
    overlay.innerHTML = "";
    hbDrift = [];
    overlay.classList.remove("light");
    backBtn.classList.remove("on-light");
    overlay.style.transition = "none";
    overlay.style.transform = "none";
    overlay.style.opacity = "1";
    overlay.style.filter = "none";
    document.querySelector(".nav").style.opacity = "";
    document.querySelector(".nav").style.pointerEvents = "";
    stage.removeAttribute("aria-hidden");
    if (btn) btn.focus({preventScroll:true});
  };
  if (REDUCE || !r){ finish(); return; }
  const sx = r.w / window.innerWidth, sy = r.h / window.innerHeight;
  const ox = r.l + r.w/2 - window.innerWidth/2;
  const oy = r.t + r.h/2 - window.innerHeight/2;
  overlay.style.transition = "transform 700ms cubic-bezier(.72,0,.16,1), opacity 420ms ease 180ms";
  overlay.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + sx + "," + sy + ")";
  overlay.style.opacity = "0";
  setTimeout(finish, 720);
}

overlay.addEventListener("click", function(e){ if (e.target.closest("[data-back]")) closeProject(); });
document.addEventListener("click", function(e){
  const n = e.target.closest(".nook");
  if (!n || moved > 6) return;
  openProject(n.dataset.project, n);
});

/* Low-contrast objects that move at their own pace as the page scrolls.
   sun = sparks, sky = clouds, earth = leaves. */
function driftLayer(kind, n){
  let h = '<div class="hb-drift" aria-hidden="true">';
  for (let i = 0; i < n; i++){
    const t = (i + 1) / (n + 1);
    const left = (t * 100 + (i % 2 ? -13 : 11)).toFixed(1);
    const top = (8 + ((i * 37) % 74)).toFixed(1);
    const sp = (0.05 + (i % 3) * 0.045).toFixed(3);
    let cls = "spark", w = 26 + (i % 3) * 16, style = "";
    if (kind === "sky"){
      cls = "cloud"; w = 90 + (i % 3) * 46;
      style = "height:" + (w * 0.3).toFixed(0) + "px;opacity:" + (0.3 + (i % 3) * 0.1).toFixed(2) + ";";
    } else if (kind === "earth"){
      cls = "leaf"; w = 20 + (i % 3) * 12;
      style = "height:" + (w * 0.62).toFixed(0) + "px;opacity:" + (0.28 + (i % 3) * 0.1).toFixed(2)

    } else {
      style = "height:" + w + "px;opacity:" + (0.4 + (i % 3) * 0.15).toFixed(2) + ";";
    }
    h += '<span class="' + cls + '" data-sp="' + sp + '" style="left:' + left + '%;top:' + top
       + '%;width:' + w + 'px;' + style + '"></span>';
  }
  return h + '</div>';
}

function hbScreenInner(key, label){
  const src = SHOTS[key];
  if (src) return '<img src="' + src + '" alt="" aria-hidden="true">';
  /* nothing to show yet, so the screen carries an abstract wash rather than a void */
  return '<span class="scr-deco" aria-hidden="true"><i></i><i></i><i></i></span>'
       + '<em>' + label + '</em>';
}
function hbPhone(key, label){
  return '<div class="hb-phone"><div class="scr">'
       + hbScreenInner(key, label) + '</div></div>';
}

/* ---- interactions ---- */
function hbSetScroll(){
  const max = overlay.scrollHeight - overlay.clientHeight;
  overlay.style.setProperty("--scroll", max > 0 ? (overlay.scrollTop / max).toFixed(4) : "0");
}
overlay.addEventListener("scroll", function(){
  if (!overlay.classList.contains("light")) return;
  hbSetScroll();
  if (!REDUCE) queueDrift();
}, {passive:true});

let hbObserver = null;

function hbTilt(el, strength){
  el.addEventListener("pointermove", function(e){
    const r = el.getBoundingClientRect();
    const nx = (e.clientX - r.left) / r.width - .5;
    const ny = (e.clientY - r.top) / r.height - .5;
    el.style.setProperty("--ry", (nx * strength).toFixed(2) + "deg");
    el.style.setProperty("--rx", (-ny * strength * .85).toFixed(2) + "deg");
    el.classList.add("lift");
  });
  el.addEventListener("pointerleave", function(){
    el.style.setProperty("--ry", "0deg");
    el.style.setProperty("--rx", "0deg");
    el.classList.remove("lift");
  });
}

let hbDrift = [], hbDriftRaf = 0;

/* Each drift object moves at its own fraction of the page's motion. Positions
   are read from the layer once per frame, not per object, and the whole thing
   is throttled to one animation frame. */
function updateDrift(){
  hbDriftRaf = 0;
  const h = overlay.clientHeight;
  for (let i = 0; i < hbDrift.length; i++){
    const g = hbDrift[i];
    const r = g.layer.getBoundingClientRect();
    if (r.bottom < -200 || r.top > h + 200) continue;
    const c = r.top + r.height / 2 - h / 2;
    for (let j = 0; j < g.kids.length; j++){
      g.kids[j].el.style.transform =
        "translate3d(0," + (c * g.kids[j].sp).toFixed(1) + "px,0)";
    }
  }
}
function queueDrift(){
  if (!hbDriftRaf) hbDriftRaf = requestAnimationFrame(updateDrift);
}

function wireHydra(root){
  if (!root.querySelector(".cs-hydra")) return;
  hbSetScroll();

  hbDrift = Array.prototype.map.call(root.querySelectorAll(".hb-drift"), function(layer){
    return {
      layer: layer,
      kids: Array.prototype.map.call(layer.children, function(el){
        return {el: el, sp: parseFloat(el.dataset.sp) || 0};
      })
    };
  });
  if (!REDUCE) queueDrift();

  /* --- everything arrives on scroll --- */
  if (hbObserver) hbObserver.disconnect();
  if (REDUCE){
    root.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
    const intro = root.querySelector(".hb-intro");
    if (intro) intro.classList.add("in");
  } else {
    hbObserver = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if (en.isIntersecting){ en.target.classList.add("in"); hbObserver.unobserve(en.target); }
      });
    }, {root: overlay, threshold:.14, rootMargin:"0px 0px -6% 0px"});
    root.querySelectorAll(".reveal, .hb-intro").forEach(function(el){ hbObserver.observe(el); });
  }

  if (!REDUCE){
    root.querySelectorAll("[data-tilt]").forEach(function(el){ hbTilt(el, 13); });

    /* the introducing banner catches the light under the pointer. It no
       longer tilts: a full-bleed band would pull away from the page edges */
    const card = root.querySelector("[data-hb-introcard]");
    if (card){
      card.addEventListener("pointermove", function(e){
        const r = card.getBoundingClientRect();
        card.style.setProperty("--mx", ((e.clientX - r.left) / r.width * 100).toFixed(1) + "%");
        card.style.setProperty("--my", ((e.clientY - r.top) / r.height * 100).toFixed(1) + "%");
      });
    }
  }

  root.querySelectorAll("[data-hb-jump]").forEach(function(b){
    b.addEventListener("click", function(){
      const t = root.querySelector("#" + b.dataset.hbJump);
      if (t) overlay.scrollTo({top: t.offsetTop - 8, behavior: REDUCE ? "auto" : "smooth"});
    });
  });

  const tabs = root.querySelectorAll("[data-hb-tab]");
  tabs.forEach(function(t){
    t.addEventListener("click", function(){
      tabs.forEach(function(o){ o.setAttribute("aria-selected", String(o === t)); });
      root.querySelectorAll(".hb-panel").forEach(function(pn){ pn.classList.remove("on"); });
      const panel = root.querySelector("#hb-p-" + t.dataset.hbTab);
      if (panel){
        /* restart the row cascade each time a view is opened */
        panel.querySelectorAll(".hb-row").forEach(function(r){
          r.style.animation = "none"; void r.offsetWidth; r.style.animation = "";
        });
        panel.classList.add("on");
      }
    });
  });

  /* a linear, non-looping carousel: the active screen sits centred and in
     front, its immediate neighbours peek from behind it, and everything
     further away is hidden until the user steps toward it */
  root.querySelectorAll("[data-hb-walk]").forEach(function(walk){
    const w = HB_WALKS[+walk.dataset.hbWalk];
    const slots = Array.prototype.slice.call(walk.querySelectorAll("[data-hb-car-slot]"));
    const dots = Array.prototype.slice.call(walk.querySelectorAll("[data-hb-car-dot]"));
    const prevBtn = walk.querySelector('[data-hb-car="prev"]');
    const nextBtn = walk.querySelector('[data-hb-car="next"]');
    const nEl = walk.querySelector("[data-hb-car-n]");
    const titleEl = walk.querySelector("[data-hb-car-title]");
    const descEl = walk.querySelector("[data-hb-car-desc]");
    let active = 0;

    const n = w.steps.length;
    function render(){
      /* the side previews wrap purely for visual balance (Screen 1's "prev"
         slot shows the last screen, Screen N's "next" slot shows the
         first) — but a wrapped preview is decorative only: it never
         becomes clickable, and the arrows never wrap the real sequence. */
      const prevIdx = (active - 1 + n) % n;
      const nextIdx = (active + 1) % n;
      const prevWrapped = active === 0;
      const nextWrapped = active === n - 1;
      slots.forEach(function(slot, i){
        slot.classList.remove("is-active","is-prev","is-next","is-far-left","is-far-right","is-decorative");
        if (i === active){
          slot.classList.add("is-active"); slot.tabIndex = -1;
        } else if (n > 1 && i === prevIdx){
          slot.classList.add("is-prev");
          slot.tabIndex = prevWrapped ? -1 : 0;
          if (prevWrapped) slot.classList.add("is-decorative");
        } else if (n > 1 && i === nextIdx){
          slot.classList.add("is-next");
          slot.tabIndex = nextWrapped ? -1 : 0;
          if (nextWrapped) slot.classList.add("is-decorative");
        } else {
          const fwd = (i - active + n) % n, back = (active - i + n) % n;
          slot.classList.add(fwd <= back ? "is-far-right" : "is-far-left");
          slot.tabIndex = -1;
        }
      });
      dots.forEach(function(d, i){ d.setAttribute("aria-current", String(i === active)); });
      if (prevBtn) prevBtn.disabled = active === 0;
      if (nextBtn) nextBtn.disabled = active === n - 1;
      const st = w.steps[active];
      nEl.textContent = "0" + (active + 1);
      titleEl.textContent = st[0];
      descEl.textContent = st[1];
    }
    function goTo(i){
      active = Math.max(0, Math.min(n - 1, i));
      render();
    }
    slots.forEach(function(slot, i){
      slot.addEventListener("click", function(){
        if (slot.classList.contains("is-decorative")) return;
        goTo(i);
      });
      slot.addEventListener("keydown", function(e){
        if (slot.classList.contains("is-decorative")) return;
        if (e.key === "Enter" || e.key === " "){ e.preventDefault(); goTo(i); }
      });
    });
    dots.forEach(function(d, i){ d.addEventListener("click", function(){ goTo(i); }); });
    if (prevBtn) prevBtn.addEventListener("click", function(){ goTo(active - 1); });
    if (nextBtn) nextBtn.addEventListener("click", function(){ goTo(active + 1); });
    render();
  });

  const pop = root.querySelector("#hb-pop");
  const picks = root.querySelectorAll("[data-hb-know]");
  picks.forEach(function(b){
    b.addEventListener("click", function(){
      const open = b.getAttribute("aria-expanded") === "true";
      picks.forEach(function(o){ o.setAttribute("aria-expanded", "false"); });
      if (open){ pop.classList.remove("on"); return; }
      const k = HB_KNOW[+b.dataset.hbKnow];
      pop.querySelector("h3").textContent = k[1];
      pop.querySelector("p").textContent = k[2];
      b.setAttribute("aria-expanded", "true");
      pop.classList.add("on");
    });
  });

  fitHydraHeadlines();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitHydraHeadlines);
}

/* Major hb-xl headlines are set editorially large, which otherwise forces
   dramatic wraps even when a line would comfortably fit. On desktop, scale
   each headline down just enough to sit on one line; below 900px (where
   sections already restack) the CSS clamp/max-width take back over and
   headlines wrap the way the layout expects. */
function fitHydraHeadlines(){
  if (!isOverlayOpen()) return;
  const root = overlay.querySelector(".cs-hydra");
  if (!root) return;
  const desktop = window.innerWidth >= 900;
  overlay.querySelectorAll(".hb-xl:not([data-hb-nofit])").forEach(function(el){
    if (!desktop){ el.style.whiteSpace = ""; el.style.fontSize = ""; return; }
    el.style.whiteSpace = "nowrap";
    el.style.fontSize = "";
    const parent = el.parentElement;
    if (!parent) return;
    const avail = parent.clientWidth;
    let size = parseFloat(getComputedStyle(el).fontSize);
    const floor = Math.max(size * 0.3, 20);
    let guard = 0;
    while (el.scrollWidth > avail && size > floor && guard < 90){
      size -= 1;
      el.style.fontSize = size + "px";
      guard++;
    }
    if (el.scrollWidth > avail) el.style.whiteSpace = "";
  });
}
let hbHeadlineRt;
window.addEventListener("resize", function(){
  clearTimeout(hbHeadlineRt);
  hbHeadlineRt = setTimeout(fitHydraHeadlines, 120);
});
