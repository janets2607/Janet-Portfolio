/* ============================================================
   HYDRABLOOM CASE STUDY
   One continuous white / yellow / blue / green wash runs the
   whole page, so sections never meet on a hard edge.
   ============================================================ */
#overlay.light{background:#ffffff}

.cs-hydra{
  /* the case study's one vertical section rhythm: every section pads its
     top and bottom by this, so two sections meet across twice this */
  --hb-sec-y:clamp(76px,13vh,164px);
  /* each hue is the base colour from :root, then blended toward white for
     larger surfaces. Nothing here introduces a new yellow, blue or green. */
  --sun:var(--hb-sun);
  --sun-soft:color-mix(in srgb, var(--hb-sun) 70%, #fff);
  --sun-light:color-mix(in srgb, var(--hb-sun) 45%, #fff);
  --sun-pale:color-mix(in srgb, var(--hb-sun) 25%, #fff);
  --sun-mist:color-mix(in srgb, var(--hb-sun) 12%, #fff);
  --sky:var(--hb-sky);
  --sky-soft:color-mix(in srgb, var(--hb-sky) 70%, #fff);
  --sky-light:color-mix(in srgb, var(--hb-sky) 45%, #fff);
  --sky-pale:color-mix(in srgb, var(--hb-sky) 25%, #fff);
  --sky-mist:color-mix(in srgb, var(--hb-sky) 12%, #fff);
  --earth:var(--hb-earth);
  --earth-soft:color-mix(in srgb, var(--hb-earth) 70%, #fff);
  --earth-light:color-mix(in srgb, var(--hb-earth) 45%, #fff);
  --earth-pale:color-mix(in srgb, var(--hb-earth) 25%, #fff);
  --earth-mist:color-mix(in srgb, var(--hb-earth) 12%, #fff);
  /* text and hairline details only: the same OKLCH hue and chroma as each
     base, with lightness lowered to .52 so small type, hover states and
     1px strokes pass 4.5:1 on white */
  --sun-ink:#806509; --sky-ink:#447080; --earth-ink:#587242;
  /* large display type only: the same OKLCH hue as each base, lowered just
     enough to read at headline size (L .78 sun, .74 sky/earth) with chroma
     lifted 1.3x so they stay fresh rather than drifting grey */
  --sun-glow:#d9b343; --sky-glow:#78b5cc; --earth-glow:#93b875;
  --hb-ink:#22302a; --hb-soft:#5b6b62; --hb-line:rgba(34,48,42,.12);
  position:relative; font-family:var(--sans); color:var(--hb-ink);
  /* one unbroken pass down the page: white, yellow, blue, green, white.
     0-13% sits behind the hero, so the visible run starts from the wave. */
  background:linear-gradient(180deg,
    #ffffff 0%, #ffffff 15%,
    var(--sun-pale) 23%, var(--sun-light) 32%, var(--sun-pale) 39%,
    var(--sky-mist) 46%,
    var(--sky-light) 54%, var(--sky-soft) 62%, var(--sky-light) 69%,
    var(--earth-pale) 76%,
    var(--earth-light) 83%, var(--earth-soft) 89%,
    var(--earth-mist) 95%, #ffffff 100%);
}
.hb-aura{position:absolute; border-radius:50%; pointer-events:none; filter:blur(90px); opacity:.5; z-index:1}

.hb-track{position:fixed; top:0; left:0; right:0; height:3px; z-index:115; background:rgba(34,48,42,.07)}
.hb-fill{height:100%; width:calc(var(--scroll,0) * 100%);
  background:linear-gradient(90deg, var(--sun), var(--sky) 54%, var(--earth))}
.hb-sun{
  position:fixed; top:1.5px; left:calc(var(--scroll,0) * 100%); z-index:116;
  width:15px; height:15px; margin:-7.5px 0 0 -7.5px; border-radius:50%;
  background:radial-gradient(circle at 38% 34%, var(--sun-mist), var(--sun-soft) 45%, var(--sun) 100%);
  box-shadow:0 0 0 4px rgba(var(--hb-sun-rgb),.35), 0 2px 10px rgba(var(--hb-sun-rgb),.8);
}

/* --- shared --- */
.hb-sec{position:relative; z-index:3; padding:var(--hb-sec-y) clamp(20px,7vw,96px)}
.hb-sec > *{max-width:1180px; margin-inline:auto}
.hb-eyebrow{font-size:10.5px; letter-spacing:.34em; text-transform:uppercase;
  color:var(--hb-soft); margin:0 0 22px}
.hb-xl{font-family:var(--serif); font-weight:600; margin:0;
  font-size:clamp(40px,6.6vw,102px); line-height:.98; letter-spacing:-.005em; max-width:16ch}
.hb-xl.wide{max-width:24ch}
.hb-lead{margin:26px 0 0; max-width:60ch; font-size:clamp(15px,1.35vw,18px);
  line-height:1.8; color:var(--hb-soft)}

.reveal{opacity:0; transform:translateY(30px);
  transition:opacity 1s var(--ease), transform 1s var(--ease)}
.reveal.in{opacity:1; transform:none}
.reveal.d1{transition-delay:.09s} .reveal.d2{transition-delay:.18s}
.reveal.d3{transition-delay:.27s} .reveal.d4{transition-delay:.36s}

/* --- phones --- */
.hb-float{animation:hbFloat 7s ease-in-out infinite}
@keyframes hbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.hb-phone{
  position:relative; width:100%; aspect-ratio:var(--ios);
  border-radius:var(--ios-r); padding:2.7%;
  background:linear-gradient(155deg,#ffffff,#e6edf2);
  box-shadow:0 34px 64px -20px rgba(32,58,78,.42), 0 6px 16px rgba(32,58,78,.13), inset 0 1px 0 #fff;
  transform:perspective(1000px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(0);
  transition:transform .5s var(--ease), box-shadow .5s var(--ease);
}
/* the Dynamic Island: 125 x 37.5pt, sitting 11pt below the top of the screen */
.hb-phone::after{
  content:""; position:absolute; top:3.2%; left:50%; width:23%; height:3.2%;
  transform:translateX(-50%); border-radius:999px;
  background:rgba(255,255,255,.5); box-shadow:0 0 0 1px rgba(255,255,255,.22);
}
.hb-phone .scr{
  width:100%; height:100%; border-radius:11% / 5.06%; overflow:hidden; position:relative;
  background:linear-gradient(to bottom, var(--sky-pale), var(--sun-pale) 54%, var(--earth-pale));
  display:flex; align-items:center; justify-content:center;
}
.hb-phone .scr img{width:100%; height:100%; object-fit:cover; display:block}
.hb-phone .scr em{font-style:normal; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
  color:rgba(34,48,42,.4); text-align:center; padding:0 14px; line-height:1.7}
/* glass glare that sweeps the screen */
.hb-phone .scr::after{
  content:""; position:absolute; top:-60%; left:-60%; width:60%; height:220%;
  transform:rotate(22deg) translateX(-40%);
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0));
  transition:transform 1s var(--ease); pointer-events:none;
}
.hb-phone:hover .scr::after{transform:rotate(22deg) translateX(340%)}
.hb-phone.lift{box-shadow:0 50px 88px -22px rgba(32,58,78,.5), 0 8px 20px rgba(32,58,78,.16), inset 0 1px 0 #fff}
/* the only pointer response a phone has: it rises a little */
.hb-phone:hover{
  transform:translateY(-10px) scale(1.015);
  box-shadow:0 52px 92px -22px rgba(14,52,48,.55), 0 10px 22px rgba(14,52,48,.2), inset 0 1px 0 #fff;
}
.scr-swap{animation:hbSwap .55s var(--ease)}
@keyframes hbSwap{from{opacity:0; transform:scale(.955) translateY(10px)}to{opacity:1; transform:none}}

/* ============================================================
   HERO
   ============================================================ */
.hb-hero{
  position:relative; z-index:3; min-height:100vh; min-height:100svh; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  gap:clamp(26px,3vw,56px);
  padding:clamp(80px,12vh,140px) clamp(20px,6vw,86px) clamp(130px,19vh,220px);
  background:linear-gradient(132deg,
    var(--sun-soft) 0%, var(--sun-light) 16%, var(--earth-light) 36%, var(--earth-soft) 56%, var(--sky-soft) 78%, var(--sky-light) 100%);
  /* oversized so there is room to slide the whole wash around */
  background-size:220% 220%;
  animation:hbSwell 38s ease-in-out infinite alternate;
}
@keyframes hbSwell{
  from{background-position:12% 34%}
  to  {background-position:88% 66%}
}

/* Broad pools of colour drifting across the wash. Their periods share no
   common factor, so the combination never visibly repeats. */
/* No filter and no border-radius here on purpose: a large blurred layer
   clipped to a circle is what was painting a dark disc behind the phones.
   The radial gradient already fades to nothing, so it needs neither. */
.hb-tide{position:absolute; z-index:1; pointer-events:none}
.hb-tide.t1{
  left:-16%; top:-22%; width:66%; height:74%; opacity:.55;
  background:radial-gradient(closest-side circle, var(--sun-soft), rgba(var(--hb-sun-rgb),.4) 42%, rgba(var(--hb-sun-rgb),0) 78%);
  animation:hbTide1 26s ease-in-out infinite alternate;
}
.hb-tide.t2{
  right:-20%; top:6%; width:72%; height:80%; opacity:.5;
  background:radial-gradient(closest-side circle, var(--sky-soft), rgba(var(--hb-sky-rgb),.4) 42%, rgba(var(--hb-sky-rgb),0) 78%);
  animation:hbTide2 31s ease-in-out infinite alternate;
}
.hb-tide.t3{
  left:8%; bottom:-30%; width:74%; height:76%; opacity:.5;
  background:radial-gradient(closest-side circle, var(--earth-soft), rgba(var(--hb-earth-rgb),.4) 42%, rgba(var(--hb-earth-rgb),0) 78%);
  animation:hbTide3 37s ease-in-out infinite alternate;
}
.hb-tide.t4{
  left:24%; top:-16%; width:56%; height:60%; opacity:.42;
  background:radial-gradient(closest-side circle, #ffffff, rgba(255,255,255,.5) 42%, rgba(255,255,255,0) 78%);
  animation:hbTide4 43s ease-in-out infinite alternate;
}
@keyframes hbTide1{from{transform:translate(-4%,-3%) scale(1)}   to{transform:translate(12%,9%)  scale(1.18)}}
@keyframes hbTide2{from{transform:translate(6%,7%)   scale(1.12)}to{transform:translate(-9%,-6%) scale(1)}}
@keyframes hbTide3{from{transform:translate(-7%,5%)  scale(1.06)}to{transform:translate(10%,-8%) scale(1.2)}}
@keyframes hbTide4{from{transform:translate(5%,-4%)  scale(1.1)} to{transform:translate(-8%,8%)  scale(1)}}
/* the wash is pale now, so the copy carries ink rather than white */
.hb-hero-copy{
  position:relative; z-index:4; color:var(--hb-ink); min-width:0;
  flex:0 1 min(43%, 580px);
}
.hb-mark{
  width:clamp(64px,6vw,92px); aspect-ratio:1; border-radius:26%;
  background:#fff center/cover no-repeat;
  box-shadow:0 16px 34px -14px rgba(20,50,45,.5);
  position:relative; overflow:hidden; margin-bottom:clamp(26px,4.5vh,46px);
}
.hb-mark i{
  position:absolute; left:50%; top:46%; width:34%; height:40%;
  transform:translate(-50%,-50%) rotate(-2deg);
  background:linear-gradient(to bottom, var(--sky-soft), var(--sky));
  border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
}
.hb-mark b{
  position:absolute; right:24%; top:26%; width:16%; height:14%;
  border-radius:70% 10% 70% 10%; background:var(--earth);
}
.hb-mark.has-icon i, .hb-mark.has-icon b{display:none}
/* the source artwork sits inset within a transparent canvas — zoom past
   that margin so the icon reads edge-to-edge with no border showing */
.hb-mark.has-icon{background-size:140% 140%; background-position:center}

/* the wordmark is HydraBloom's logotype rather than a heading in this
   document, so it is set in the product's own face */
.hb-word2{
  margin:0; font-family:var(--brand); font-weight:700;
  /* one unbreakable word in a column capped at 500px, so it is scaled against
     that column rather than the whole window */
  font-size:clamp(30px, min(3.6vw, 7.2vh), 62px); line-height:1.04; letter-spacing:0;
  color:var(--hb-ink);
}
/* the same face, weight, and colour as every lead paragraph on the page */
/* same face, weight, size and colour as the body copy through the page */
.hb-desc{
  margin:clamp(18px,3vh,30px) 0 0; max-width:58ch; white-space:nowrap;
  font-family:var(--sans); font-weight:400;
  font-size:clamp(13.5px, min(1.35vw, 1.9vh), 18px); line-height:1.78;
  color:var(--hb-soft);
}
.hb-meta{
  display:flex; flex-wrap:wrap; gap:clamp(18px,2.6vw,40px);
  margin:clamp(28px,4.5vh,50px) 0 0; padding:0;
}
.hb-meta dt{font-family:var(--sans); font-size:clamp(8.5px, .78vw, 10px); letter-spacing:.24em;
  text-transform:uppercase; color:var(--hb-soft)}
.hb-meta dd{margin:7px 0 0; font-family:var(--sans); font-size:clamp(12.5px, 1.1vw, 14px);
  font-weight:500; color:var(--hb-ink)}

/* Cluster geometry taken from the reference: the group occupies the right 62%
   of the hero at full height, each device is 38.6% of that width, and all four
   share one clockwise tilt so the tops lean right. The upper pair is cropped
   by the top edge, the lower pair sits clear of it. */
/* The cluster is inset from the hero's edges, and the phones are sized from
   ITS height rather than the viewport — so they can never reach the wave, the
   copy, or the right edge no matter how the window is shaped. */
/* sits beside the copy as a flex item, so the two travel together and the
   pair stays centred as a group rather than pinned to the right edge */
.hb-cluster{
  position:relative; align-self:stretch; min-width:0;
  flex:0 1 min(46%, 620px);
  z-index:3; pointer-events:none;
}
/* A phone stands 74% of the cluster tall — about 54% of the viewport, which is
   where it reads at full size. The two caps stop it outgrowing the space:
   62vh keeps the pair clear of top and bottom, 34vw keeps it clear of the copy
   on narrow desktops. Whichever binds first wins. */
/* Width-driven, not height-driven. Three handsets at 13% overlap span 2.74x
   one phone's width, so capping a phone at 32% of the cluster guarantees the
   trio fits across it at any size. 22vh keeps the same true vertically, and
   210px stops them ballooning on very large displays. */
.hb-cluster .pod{
  position:absolute; pointer-events:auto;
  width:min(29%, 19vh, 190px);
  aspect-ratio:var(--ios); height:auto;
  animation:hbBob 8s ease-in-out infinite;
}
/* the centre screen — starting screen.png — is the focal phone: slightly
   larger and, via its higher z-index below, standing in front of the pair */
.hb-cluster .p2{width:min(35%, 23.5vh, 232px)}
/* height drives the phone; the aspect ratio gives back the width */
.hb-cluster .hb-phone{
  height:100%; width:auto;
  aspect-ratio:var(--ios);
  border-radius:var(--ios-r);
  padding:2.7%;
  box-shadow:0 26px 54px -30px rgba(28,66,84,.3), 0 4px 12px rgba(28,66,84,.09), inset 0 1px 0 #fff;
}
/* bob drives the independent translate property so the tilt survives */
@keyframes hbBob{0%,100%{translate:0 0}50%{translate:0 -16px}}
/* both hang off the centre and are offset by a share of their OWN size, so the
   overlap and the step stay identical at every screen size */
/* All three hang off the centre of the cluster and are offset by a share of
   their OWN width, so the 13% overlap holds at every size. Centres sit at
   -0.87w, 0 and +0.87w; the middle one drops lower and sits in front. */
.hb-cluster .pod{left:50%; top:50%}
.hb-cluster .p1{
  z-index:3;
  transform:translate(-151%, -64%) rotate(-13deg);
  animation-delay:-.4s;
}
.hb-cluster .p2{
  z-index:4;
  transform:translate(-50%, -36%) rotate(-1deg);
  animation-delay:-3.2s;
}
.hb-cluster .p3{
  z-index:2;
  transform:translate(41%, -58%) rotate(12deg);
  animation-delay:-6s;
}
/* the only pointer response left: a gentle lift and a pass of glare */
.hb-cluster .hb-phone:hover{
  transform:scale(1.035);
  box-shadow:0 34px 66px -30px rgba(28,66,84,.36), 0 6px 16px rgba(28,66,84,.12), inset 0 1px 0 #fff;
}


/* placeholder screens get an abstract composition instead of dead space */
.scr-deco{position:absolute; inset:0; overflow:hidden}
.scr-deco i{position:absolute; border-radius:50%; filter:blur(15px); opacity:.75}
.scr-deco i:nth-of-type(1){width:150%; height:44%; left:-28%; top:-10%;
  background:radial-gradient(circle, var(--sun), rgba(var(--hb-sun-rgb),0) 70%)}
.scr-deco i:nth-of-type(2){width:160%; height:48%; left:-34%; top:28%;
  background:radial-gradient(circle, var(--sky), rgba(var(--hb-sky-rgb),0) 70%)}
.scr-deco i:nth-of-type(3){width:150%; height:46%; left:-24%; bottom:-12%;
  background:radial-gradient(circle, var(--earth), rgba(var(--hb-earth-rgb),0) 70%)}
.scr-deco::before, .scr-deco::after{
  content:""; position:absolute; border-radius:50%; border:1.5px solid rgba(255,255,255,.6);
}
.scr-deco::before{width:164%; height:62%; left:-32%; top:14%; transform:rotate(-13deg)}
.scr-deco::after{width:140%; height:52%; left:-16%; top:46%;
  transform:rotate(9deg); border-color:rgba(255,255,255,.4)}

.hb-wave{position:absolute; left:0; right:0; bottom:-1px; z-index:5; pointer-events:none; line-height:0}
.hb-wave svg{display:block; width:100%; height:clamp(90px,15vh,190px)}
/* both crests are anchored to the bottom edge, so a little vertical swell
   reads as water without ever opening a gap */
.hb-wave path{transform-box:fill-box; transform-origin:50% 100%}
.hb-wave path:nth-child(1){animation:hbCrestA 13s ease-in-out infinite alternate}
.hb-wave path:nth-child(2){animation:hbCrestB 17s ease-in-out infinite alternate}
@keyframes hbCrestA{from{transform:translateY(3%)  scaleY(1)}    to{transform:translateY(-4%) scaleY(1.07)}}
@keyframes hbCrestB{from{transform:translateY(-3%) scaleY(1.05)} to{transform:translateY(3%)  scaleY(1)}}

/* ============================================================
   SECTIONS
   ============================================================ */
.hb-chapters{list-style:none; margin:clamp(38px,6vh,66px) 0 0; padding:0;
  display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr));
  border-top:1px solid var(--hb-line)}
.hb-chapters li{border-bottom:1px solid var(--hb-line)}
.hb-chapters button{display:block; width:100%; text-align:left; padding:28px 4px;
  transition:color .3s var(--ease), padding-left .3s var(--ease)}
.hb-chapters button:hover{color:var(--earth-ink); padding-left:12px}
.hb-chapters .n{display:block; font-size:11px; letter-spacing:.24em; color:var(--hb-soft); margin-bottom:10px}
.hb-chapters .t{display:block; font-family:var(--serif); font-size:20px; line-height:1.3}

.hb-cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(262px,1fr));
  gap:clamp(16px,2vw,26px); margin-top:clamp(40px,6vh,68px)}
.hb-card{position:relative; overflow:hidden; padding:clamp(28px,3.2vw,38px) clamp(26px,3vw,36px);
  border-radius:18px;
  background:linear-gradient(165deg,
    color-mix(in srgb, var(--tint, #fff) 13%, #fff) 0%, rgba(255,255,255,.76) 62%);
  border:1px solid color-mix(in srgb, var(--tint, #fff) 24%, rgba(255,255,255,.9));
  box-shadow:0 20px 44px -26px rgba(32,58,78,.42);
  transition:transform .4s var(--ease), box-shadow .4s var(--ease);}
.hb-card:hover{transform:translateY(-3px); box-shadow:0 26px 52px -26px rgba(32,58,78,.5)}
.hb-card .rule{position:relative; display:block; width:26px; height:3px; border-radius:2px;
  margin:0 0 16px; background:var(--tint, var(--hb-ink))}
.hb-card h3{position:relative; margin:0 0 12px; font-size:10.5px; letter-spacing:.26em;
  text-transform:uppercase; color:var(--hb-soft)}
.hb-card p{position:relative; margin:0; font-size:15px; line-height:1.75; color:var(--hb-soft); max-width:36ch}

/* --- research: three views, one row style --- */
.hb-tabs{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:clamp(64px,9vh,104px) 0 0}
.hb-tabs button{padding:13px 24px; border-radius:999px; font-size:12px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--hb-soft);
  background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.9);
  transition:background .35s var(--ease), color .35s var(--ease), box-shadow .35s var(--ease)}
.hb-tabs button:hover{background:#fff}
.hb-tabs button[aria-selected="true"]{background:var(--hb-ink); color:#fff; border-color:var(--hb-ink);
  box-shadow:0 12px 26px -12px rgba(34,48,42,.7)}
.hb-panel{display:none; margin-top:clamp(40px,6vh,64px)}
.hb-panel.on{display:block}
.hb-stack{display:grid; gap:12px}
.hb-row{
  padding:clamp(24px,2.8vw,34px) clamp(24px,3vw,40px); border-radius:16px;
  background:rgba(255,255,255,.74); border:1px solid rgba(255,255,255,.92);
  box-shadow:0 18px 40px -24px rgba(32,58,78,.4);
  opacity:0; transform:translateY(22px);
  animation:hbRow .7s var(--ease) forwards;
  transition:transform .45s var(--ease), box-shadow .45s var(--ease);
}
.hb-panel.on .hb-row:nth-child(1){animation-delay:.02s}
.hb-panel.on .hb-row:nth-child(2){animation-delay:.10s}
.hb-panel.on .hb-row:nth-child(3){animation-delay:.18s}
.hb-panel.on .hb-row:nth-child(4){animation-delay:.26s}
@keyframes hbRow{to{opacity:1; transform:none}}
.hb-row:hover{transform:translateX(8px); box-shadow:0 26px 52px -26px rgba(32,58,78,.48)}
.hb-row h4{margin:0 0 10px; font-family:var(--serif); font-size:clamp(20px,2.1vw,27px); font-weight:600}
.hb-row p{margin:0; font-size:15.5px; line-height:1.78; color:var(--hb-soft); max-width:74ch}
.hb-row p + p{margin-top:8px}
.hb-row b{color:var(--hb-ink); font-weight:600}

/* --- the introducing banner --- */
/* the reveal moment: everything above explains the work, this is the turn
   where the product itself appears. It runs edge to edge as a wide
   editorial band, washed in the same sun/earth/sky atmosphere the rest of
   the case study is built from */
/* the banner stands alone between sections: its own section padding plus
   each neighbour's gives it the same full gap two sections meet across,
   while the band itself stays edge to edge */
.hb-intro{position:relative; z-index:3; padding:var(--hb-sec-y) 0}
.hb-intro-wrap{width:100%}
.hb-intro-card{
  position:relative; overflow:hidden; text-align:center;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  min-height:clamp(260px,42vh,460px);
  padding:clamp(64px,12vh,128px) clamp(20px,7vw,96px);
  background:linear-gradient(100deg, var(--sun-light) 0%, var(--earth-light) 50%, var(--sky-light) 100%);
}
.hb-intro-card::before{
  content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
  background:radial-gradient(620px circle at var(--mx,50%) var(--my,10%),
    rgba(255,255,255,.95), rgba(255,255,255,0) 62%);
  opacity:.85;
}
.hb-intro-card::after{
  content:""; position:absolute; top:-70%; left:-40%; width:34%; height:240%;
  z-index:0; pointer-events:none; transform:rotate(20deg);
  background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.7), rgba(255,255,255,0));
  animation:hbSheen 8s ease-in-out infinite;
}
@keyframes hbSheen{0%,100%{transform:translateX(-30%) rotate(20deg)}50%{transform:translateX(400%) rotate(20deg)}}
.hb-orb{position:absolute; border-radius:50%; filter:blur(60px); pointer-events:none; z-index:0; opacity:.8}
.hb-intro h2{
  position:relative; z-index:1; margin:0 auto; max-width:16ch; text-align:center;
  font-family:var(--serif); font-weight:600;
  font-size:clamp(40px,7.6vw,128px); line-height:1.0; letter-spacing:-.015em; color:var(--hb-ink);
}
.hb-intro h2 span{display:inline-block; opacity:0; transform:translateY(42px) rotate(3deg);
  transition:opacity 1s var(--ease), transform 1s var(--ease)}
.hb-intro.in h2 span{opacity:1; transform:none}
.hb-intro .sub{position:relative; z-index:1; margin:clamp(14px,2vh,22px) auto 0; max-width:46ch;
  font-size:clamp(14px,1.3vw,18px); line-height:1.7; color:var(--hb-soft); text-align:center}

/* --- visual system --- */
.hb-trio{display:grid; grid-template-columns:repeat(auto-fit,minmax(276px,1fr));
  gap:clamp(16px,2.2vw,28px); margin-top:clamp(44px,6vh,72px); perspective:1200px}
.hb-el{
  position:relative; border-radius:20px; padding:clamp(30px,3.4vw,44px);
  display:flex; flex-direction:column;
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 22px 50px -26px rgba(32,58,78,.5);
  transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));
  transition:transform .55s var(--ease), box-shadow .55s var(--ease);
}
.hb-el:hover{box-shadow:0 40px 76px -28px rgba(32,58,78,.55)}
.hb-el--sun{background:linear-gradient(165deg,var(--sun-mist),var(--sun-light))}
.hb-el--sky{background:linear-gradient(165deg,var(--sky-mist),var(--sky-light))}
.hb-el--earth{background:linear-gradient(165deg,var(--earth-mist),var(--earth-light))}
.hb-el h3{margin:0 0 14px; font-family:var(--serif);
  font-size:clamp(30px,3.4vw,46px); font-weight:600; letter-spacing:.01em}
.hb-el p{margin:0; font-size:15.5px; line-height:1.7; color:var(--hb-ink); opacity:.8}
.hb-el .where{margin-top:22px; padding-top:18px; border-top:1px solid rgba(34,48,42,.2)}
.hb-el .where b{display:block; font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  margin-bottom:8px; opacity:.6}
.hb-el .where span{display:block; font-size:14.5px; line-height:1.68}

/* --- typeface specimen --- */
.hb-type{
  display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);
  gap:clamp(22px,3vw,48px); align-items:center;
  margin-top:clamp(28px,4vh,48px); padding:clamp(28px,3.4vw,44px);
  border-radius:20px; border:1px solid rgba(255,255,255,.85);
  background:linear-gradient(150deg, rgba(255,255,255,.82), rgba(255,255,255,.5));
  box-shadow:0 22px 50px -30px rgba(32,58,78,.45);
}
.hb-type-word{
  display:block; font-family:var(--brand); font-weight:700;
  font-size:clamp(34px,5.6vw,84px); line-height:1.06; letter-spacing:.005em;
  color:var(--hb-ink);
}
.hb-type-set{
  display:block; margin-top:16px; font-family:var(--brand); font-weight:600;
  font-size:clamp(13px,1.5vw,20px); line-height:1.7; color:rgba(34,48,42,.5);
  word-spacing:.14em;
}
.hb-type-meta b{
  display:block; font-family:var(--brand); font-weight:700;
  font-size:clamp(20px,2.2vw,30px); color:var(--hb-ink); margin-bottom:6px;
}
.hb-type-meta .cut{
  display:block; font-size:10px; letter-spacing:.24em; text-transform:uppercase;
  color:var(--hb-soft); margin-bottom:16px;
}
.hb-type-meta p{margin:0; font-size:14.5px; line-height:1.72; color:var(--hb-soft)}

/* --- walkthroughs: numbers left, screen always right --- */
.hb-walk{padding:clamp(50px,9vh,110px) 0}
/* ties each set of screens back to the element it belongs to */
.hb-walk-sub{
  margin:16px 0 0; max-width:56ch;
  font-size:clamp(14.5px,1.35vw,18px); line-height:1.7; color:var(--hb-soft);
}
.hb-walk-sub b{
  position:relative; padding-left:20px; margin-right:2px;
  font-weight:600; color:var(--hb-ink);
}
.hb-walk-sub b::before{
  content:""; position:absolute; left:0; top:50%; margin-top:-5px;
  width:11px; height:11px; border-radius:50%;
  background:var(--halo, currentColor);
  box-shadow:0 0 0 4px rgba(34,48,42,.08);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--halo, currentColor) 22%, transparent);
}
/* --- the walkthrough itself is a linear, non-looping phone carousel:
   active screen centred and full-size, its neighbours peeking from behind
   it, tinted from the walk's own --halo (sky/sun/earth) --- */
.hb-carousel{margin-top:clamp(38px,5.5vh,60px)}
.hb-car-stage{position:relative; width:100%; max-width:640px; margin:0 auto;
  padding:0 clamp(44px,6vw,64px)}
.hb-car-track{position:relative; width:100%; max-width:270px; margin:0 auto; aspect-ratio:var(--ios)}
.hb-car-glow{position:absolute; inset:-12%; z-index:0; pointer-events:none; border-radius:50%;
  background:radial-gradient(circle, var(--halo, rgba(255,255,255,.9)), rgba(255,255,255,0) 64%);
  filter:blur(30px); opacity:.55; animation:hbPulse 3.6s ease-in-out infinite}
@keyframes hbPulse{
  0%,100%{opacity:.4; transform:scale(.9)}
  50%    {opacity:.7; transform:scale(1.08)}
}
.hb-car-slot{position:absolute; inset:0; z-index:1; cursor:default;
  transition:transform .6s var(--ease), opacity .55s var(--ease)}
.hb-car-slot .hb-phone{width:100%; height:100%; margin:0}
.hb-car-slot:focus-visible{outline:2px solid var(--halo, var(--amber-soft)); outline-offset:4px; border-radius:11%/5%}
.hb-car-slot.is-active{transform:translateX(0) scale(1); opacity:1; z-index:5; pointer-events:none}
.hb-car-slot.is-active .hb-phone{box-shadow:
  0 34px 64px -20px rgba(32,58,78,.4),
  0 0 46px -6px var(--halo-cast, transparent),
  inset 0 1px 0 #fff}
.hb-car-slot.is-prev, .hb-car-slot.is-next{pointer-events:auto; cursor:pointer}
/* a wrapped preview at either end of the sequence — shown only to keep the
   three-phone composition balanced, never an actual navigation target */
.hb-car-slot.is-decorative{pointer-events:none; cursor:default}
.hb-car-slot.is-prev{transform:translateX(-58%) scale(.76); opacity:.5; z-index:3}
.hb-car-slot.is-next{transform:translateX(58%) scale(.76); opacity:.5; z-index:3}
.hb-car-slot.is-far-left{transform:translateX(-100%) scale(.6); opacity:0; z-index:1}
.hb-car-slot.is-far-right{transform:translateX(100%) scale(.6); opacity:0; z-index:1}

.hb-car-nav{position:absolute; top:50%; transform:translateY(-50%); z-index:6;
  width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:rgba(255,255,255,.75); border:1px solid color-mix(in srgb, var(--halo, #000) 22%, transparent);
  color:var(--hb-ink); transition:background .3s var(--ease), opacity .3s var(--ease)}
.hb-car-nav:hover{background:#fff}
.hb-car-nav:focus-visible{outline:2px solid var(--halo, var(--amber-soft)); outline-offset:2px}
.hb-car-nav.prev{left:0} .hb-car-nav.next{right:0}
.hb-car-nav i{display:block; width:7px; height:7px; border-style:solid; border-color:currentColor; border-width:0 2px 2px 0}
.hb-car-nav.next i{transform:rotate(-45deg); margin-left:-2px}
.hb-car-nav.prev i{transform:rotate(135deg); margin-right:-2px}
.hb-car-nav:disabled{opacity:.22; pointer-events:none}

.hb-car-caption{text-align:center; max-width:520px; margin:clamp(26px,3.6vh,40px) auto 0}
.hb-car-n{margin:0 0 8px; font-size:11px; letter-spacing:.26em; text-transform:uppercase; color:var(--hb-soft)}
.hb-car-title{margin:0 0 12px; font-family:var(--serif); font-weight:600;
  font-size:clamp(21px,2.2vw,28px); color:var(--hb-ink)}
.hb-car-desc{margin:0; font-size:clamp(14px,1.05vw,15.5px); line-height:1.75; color:var(--hb-soft)}

.hb-car-dots{display:flex; justify-content:center; align-items:center; gap:8px;
  margin-top:clamp(20px,3vh,28px)}
.hb-car-dots button{width:7px; height:7px; padding:0; border-radius:4px;
  background:rgba(34,48,42,.18); transition:background .3s var(--ease), width .3s var(--ease)}
.hb-car-dots button:focus-visible{outline:2px solid var(--halo, var(--amber-soft)); outline-offset:3px}
.hb-car-dots button[aria-current="true"]{width:20px; background:var(--halo, var(--hb-ink))}

/* --- knowledge: centred screens, tap to reveal --- */
.hb-screens{display:flex; flex-wrap:wrap; justify-content:center;
  gap:clamp(26px,5vw,72px); margin:clamp(46px,7vh,80px) auto 0; max-width:860px}
.hb-pick{position:relative; display:block; width:clamp(140px,17vw,208px);
  transition:transform .5s var(--ease)}
.hb-pick:hover{transform:translateY(-12px)}
.hb-pick .tapme{display:block; margin-top:20px; text-align:center;
  font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--hb-soft);
  transition:color .35s var(--ease)}
.hb-pick:hover .tapme, .hb-pick[aria-expanded="true"] .tapme{color:var(--earth-ink)}
.hb-pick[aria-expanded="true"] .hb-phone{
  box-shadow:0 0 0 3px var(--earth), 0 50px 88px -22px rgba(32,58,78,.5)}
.hb-pop{
  position:relative; margin:clamp(30px,4.5vh,52px) auto 0; max-width:660px; text-align:center;
  border-radius:22px; padding:clamp(28px,3.6vw,46px);
  background:rgba(255,255,255,.8);
  -webkit-backdrop-filter:blur(20px); backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.96);
  box-shadow:0 40px 80px -34px rgba(32,58,78,.55);
  opacity:0; transform:translateY(20px) scale(.97); pointer-events:none;
  transition:opacity .5s var(--ease), transform .5s var(--ease);
}
.hb-pop.on{opacity:1; transform:none; pointer-events:auto}
.hb-pop h3{margin:0 0 14px; font-family:var(--serif); font-size:clamp(24px,2.8vw,36px); font-weight:600}
.hb-pop p{margin:0 auto; max-width:56ch; font-size:15.5px; line-height:1.8; color:var(--hb-soft)}

.hb-foot{position:relative; z-index:3; text-align:center;
  padding:clamp(60px,10vh,120px) clamp(20px,7vw,96px) clamp(90px,14vh,150px)}
.hb-foot .thanks{margin:0 0 28px; font-family:var(--serif);
  font-size:clamp(24px,3.4vw,44px); font-weight:600; color:var(--hb-ink)}
.hb-back{display:inline-block; padding:15px 34px; border-radius:999px;
  border:1px solid rgba(34,48,42,.28); color:var(--hb-ink);
  font-size:11px; letter-spacing:.2em; text-transform:uppercase;
  transition:background .35s var(--ease), border-color .35s var(--ease)}
.hb-back:hover{background:rgba(255,255,255,.8); border-color:var(--hb-ink)}
.back.on-light{background:rgba(255,255,255,.84); border-color:rgba(34,48,42,.2); color:#22302a}
.back.on-light:hover{background:#fff; border-color:rgba(34,48,42,.45)}


/* ============================================================
   THE PROBLEM
   ============================================================ */
.hb-statement{
  font-family:var(--serif); font-weight:600; margin:0;
  font-size:clamp(32px,5.6vw,82px); line-height:1.06; letter-spacing:-.01em;
  max-width:19ch; color:var(--hb-ink);
}
/* the phrase runs through the project's three colours. A flat fallback comes
   first, so browsers without background-clip still get a readable line. */
.hb-statement em{font-style:italic; color:var(--sky-glow)}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  /* One gradient reads across the phrase in order — sun at "So", leaf in the
     middle, sky by "forgetting?" — split over its two lines, each line
     carrying its own part so the colours meet exactly at the break (the
     first line is ~64.5% of the phrase's length). Each line also gets room
     on both sides: the italic "f" and "?" lean past their text box, and
     text clipped to a background is only painted inside that box. The
     negative margin gives the room back, so nothing moves. */
  .hb-statement em > span{
    display:inline;
    padding:0 .2em .18em; margin:0 -.2em;
    -webkit-background-clip:text; background-clip:text;
    color:transparent; -webkit-text-fill-color:transparent;
  }
  .hb-statement em > span:first-child{
    background-image:linear-gradient(90deg,
      var(--sun-glow) 0%, var(--sun-glow) 46.5%,
      var(--earth-glow) 69.7%, var(--earth-glow) 92.9%,
      color-mix(in srgb, var(--earth-glow), var(--sky-glow) 30.3%) 100%);
  }
  .hb-statement em > span:last-child{
    background-image:linear-gradient(90deg,
      color-mix(in srgb, var(--earth-glow), var(--sky-glow) 30.3%) 0%,
      var(--sky-glow) 29.6%, var(--sky-glow) 100%);
  }
}

.hb-cycle{
  --cyc-gap:clamp(14px,2.2vw,30px);
  list-style:none; margin:clamp(40px,6vh,74px) 0 0; padding:0;
  display:grid; grid-template-columns:repeat(4,1fr); gap:var(--cyc-gap);
}
.hb-cycle li{position:relative; padding:clamp(22px,2.6vw,32px)}
.hb-cycle li:not(:last-child)::after{
  content:""; position:absolute; top:50%; z-index:2;
  right:calc(var(--cyc-gap) / -2 - 5px);
  width:10px; height:10px;
  border-top:2px solid rgba(34,48,42,.3); border-right:2px solid rgba(34,48,42,.3);
  transform:translateY(-50%) rotate(45deg);
}
.hb-cycle .n{display:block; font-size:10px; letter-spacing:.26em; color:var(--hb-soft); margin-bottom:12px}
.hb-cycle h4{margin:0 0 8px; font-family:var(--serif); font-size:clamp(19px,2.1vw,26px); font-weight:600}
.hb-cycle p{margin:0; font-size:14.5px; line-height:1.7; color:var(--hb-soft)}

/* the loop back to the start */
.hb-loop{position:relative; height:clamp(52px,7vh,74px); margin-top:6px}
.hb-loop::before{
  content:""; position:absolute; left:11%; right:11%; top:0; height:clamp(30px,4vh,42px);
  border:2px solid rgba(34,48,42,.2); border-top:none; border-radius:0 0 20px 20px;
}
.hb-loop .tip{
  position:absolute; left:11%; top:-5px; width:10px; height:10px; margin-left:-5px;
  border-left:2px solid rgba(34,48,42,.3); border-top:2px solid rgba(34,48,42,.3);
  transform:rotate(45deg);
}
.hb-loop .lbl{
  position:absolute; left:50%; top:calc(clamp(30px,4vh,42px) - 11px); transform:translateX(-50%);
  padding:4px 14px; border-radius:999px; background:rgba(255,255,255,.92);
  font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--hb-soft);
}

/* ============================================================
   WHO THIS IS FOR
   ============================================================ */
.hb-personas{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(258px,1fr));
  gap:clamp(16px,2.2vw,28px); margin-top:clamp(6px,1vh,12px);
}
/* the interview cards' surface, shared with the problem-cycle cards above
   so both read as one card style */
.hb-persona, .hb-cycle li{
  border-radius:18px;
  background:rgba(255,255,255,.76); border:1px solid rgba(255,255,255,.94);
  box-shadow:0 18px 44px -28px rgba(32,58,78,.45);
}
.hb-persona{
  padding:clamp(24px,3vw,34px);
  transition:transform .45s var(--ease), box-shadow .45s var(--ease);
}
.hb-persona:hover{transform:translateY(-7px); box-shadow:0 30px 60px -28px rgba(32,58,78,.5)}
.hb-persona .who{display:flex; align-items:center; gap:15px; margin-bottom:20px}
.hb-avatar{
  flex:0 0 auto; width:54px; height:54px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:600; font-size:22px; color:var(--hb-ink);
  box-shadow:0 8px 18px -8px rgba(34,48,42,.5);
}
.hb-persona h4{margin:0; font-family:var(--serif); font-size:clamp(20px,2vw,25px);
  font-weight:600; line-height:1.2; color:var(--hb-ink)}
.hb-persona .meta{display:block; margin-top:5px; font-size:10px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--hb-soft)}
.hb-persona blockquote{
  margin:0 0 20px; font-family:var(--serif); font-style:italic;
  font-size:clamp(15px,1.5vw,18px); line-height:1.55; color:var(--hb-ink);
}
.hb-persona dl{margin:0; display:grid; gap:15px; padding-top:18px;
  border-top:1px solid rgba(34,48,42,.14)}
.hb-persona dt{font-size:9.5px; letter-spacing:.22em; text-transform:uppercase;
  color:rgba(34,48,42,.45); font-weight:600}
.hb-persona dd{margin:6px 0 0; font-size:14px; line-height:1.68; color:var(--hb-soft)}

/* the caption sits above the cards, with three lines opening out toward them */
.hb-converge{position:relative; height:clamp(64px,9vh,94px); margin-top:clamp(30px,4.5vh,52px)}
.hb-converge .lbl{
  position:absolute; left:50%; top:0; transform:translateX(-50%);
  padding:4px 14px; border-radius:999px; background:rgba(255,255,255,.92);
  font-size:10px; letter-spacing:.22em; text-transform:uppercase; color:var(--hb-soft);
  white-space:nowrap;
}
.hb-converge i{
  position:absolute; top:28px; left:50%; width:1.5px; height:calc(100% - 28px);
  transform-origin:top center;
  background:linear-gradient(to bottom, rgba(34,48,42,.3), rgba(34,48,42,0));
}
.hb-converge .c1{transform:rotate(-24deg)}
.hb-converge .c2{transform:rotate(0deg)}
.hb-converge .c3{transform:rotate(24deg)}

/* ============================================================
   RESEARCH -> DESIGN DECISION
   ============================================================ */
.hb-bridge{
  list-style:none; margin:clamp(40px,6vh,70px) 0 0; padding:0;
  border-top:1px solid var(--hb-line);
}
.hb-bridge li{
  display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1.25fr);
  gap:clamp(14px,2.6vw,40px); align-items:center;
  padding:clamp(24px,3vw,36px) 4px; border-bottom:1px solid var(--hb-line);
}
.hb-bridge .from{
  font-size:clamp(15px,1.6vw,20px); line-height:1.5; color:var(--hb-soft);
}
.hb-bridge .from b{display:block; font-size:9.5px; letter-spacing:.24em;
  text-transform:uppercase; color:rgba(34,48,42,.4); margin-bottom:9px; font-weight:600}
.hb-bridge .arw{position:relative; width:clamp(34px,5vw,76px); height:2px;
  background:linear-gradient(90deg, rgba(34,48,42,.16), rgba(34,48,42,.42))}
.hb-bridge .arw::after{content:""; position:absolute; right:0; top:50%; width:9px; height:9px;
  border-top:2px solid rgba(34,48,42,.42); border-right:2px solid rgba(34,48,42,.42);
  transform:translateY(-50%) rotate(45deg)}
.hb-bridge .to h4{margin:0 0 8px; font-family:var(--serif); font-weight:600;
  font-size:clamp(18px,2.2vw,28px); line-height:1.2; color:var(--hb-ink)}
.hb-bridge .to p{margin:0; font-size:14.5px; line-height:1.7; color:var(--hb-soft); max-width:46ch}

/* ============================================================
   USER FLOW
   ============================================================ */
.hb-flow{margin-top:clamp(40px,6vh,70px)}
.hb-flow-main{
  list-style:none; margin:0; padding:0 2px 10px; display:flex;
  gap:clamp(12px,1.8vw,26px); overflow-x:auto; scrollbar-width:thin;
}
.hb-fnode{flex:0 0 clamp(106px,12vw,152px); text-align:center}
.hb-fnode .fwrap{position:relative; display:block}
/* the arrow sits on the middle of the screen, not the middle of the card */
.hb-fnode:not(:last-child) .fwrap::after{
  content:""; position:absolute; top:50%; z-index:2;
  right:calc(clamp(12px,1.8vw,26px) / -2 - 5px);
  width:10px; height:10px;
  border-top:2px solid rgba(34,48,42,.34); border-right:2px solid rgba(34,48,42,.34);
  transform:translateY(-50%) rotate(45deg);
}
.hb-fnode h4{margin:14px 0 0; font-family:var(--serif); font-weight:600;
  font-size:clamp(14px,1.4vw,18px); line-height:1.25; color:var(--hb-ink)}
.hb-fnode p{margin:7px 0 0; font-size:12px; line-height:1.55; color:var(--hb-soft)}
.hb-fnode .step{
  display:inline-flex; align-items:center; justify-content:center;
  width:22px; height:22px; margin-bottom:11px; border-radius:50%;
  background:rgba(34,48,42,.08); color:var(--hb-soft);
  font-size:10.5px; font-weight:600;
}
/* the one screen everything else hangs off */
.hb-fnode.hub .hb-frame{box-shadow:0 0 0 2px var(--sky), 0 14px 30px -20px rgba(32,58,78,.5)}
.hb-fnode.hub .step{background:var(--sky); color:var(--hb-ink)}

.hb-flow-alt{
  margin-top:clamp(30px,4vh,46px); padding-top:clamp(24px,3.4vh,38px);
  border-top:1px dashed rgba(34,48,42,.22);
}
.hb-flow-alt .from{
  margin:0 0 clamp(18px,2.6vh,26px); font-size:10.5px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--hb-soft);
}
.hb-flow-alt .from b{color:var(--sky-ink); font-weight:600}
.hb-flow-alt ul{list-style:none; margin:0; padding:0; display:flex;
  gap:clamp(12px,2vw,30px); flex-wrap:wrap}
.hb-flow-alt li{flex:0 1 clamp(98px,11vw,138px); text-align:center}
.hb-flow-alt h4{margin:12px 0 0; font-family:var(--serif); font-weight:600;
  font-size:clamp(13px,1.3vw,16px); color:var(--hb-ink)}
.hb-flow-alt p{margin:5px 0 0; font-size:11px; line-height:1.5; color:var(--hb-soft)}

/* ============================================================
   ITERATIONS
   ============================================================ */
.hb-iters{display:grid; gap:clamp(18px,2.6vw,32px); margin-top:clamp(40px,6vh,70px)}
.hb-iter{
  padding:clamp(24px,3vw,38px); border-radius:20px;
  background:rgba(255,255,255,.7); border:1px solid rgba(255,255,255,.92);
  box-shadow:0 20px 46px -30px rgba(32,58,78,.45);
}
.hb-iter-label{margin:0 0 10px; font-size:10.5px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--hb-soft)}
.hb-iter > h4{margin:0 0 clamp(30px,4vh,40px); font-family:var(--serif);
  font-weight:600; font-size:clamp(20px,2.3vw,29px)}
/* the phones are the centerpiece: generous room around the row, but each
   phone sits close to its own caption so the two read as one unit */
.hb-iter-row{display:flex; align-items:center; justify-content:center;
  gap:clamp(20px,3.6vw,52px); flex-wrap:wrap}
.hb-iter-fig{margin:0; text-align:center; flex:0 1 clamp(170px,20vw,252px);
  transition:opacity .4s var(--ease)}
.hb-iter-fig figcaption{margin-top:9px; font-size:10px; letter-spacing:.2em;
  text-transform:uppercase; color:var(--hb-soft); opacity:.7;
  transition:opacity .4s var(--ease), color .4s var(--ease)}
.hb-frame{
  position:relative; width:100%; aspect-ratio:var(--ios); border-radius:11% / 5.06%; overflow:hidden;
  background:linear-gradient(to bottom, var(--sky-pale), var(--sun-pale) 54%, var(--earth-pale));
  border:1px solid rgba(255,255,255,.9);
  box-shadow:0 14px 30px -20px rgba(32,58,78,.5);
  display:flex; align-items:center; justify-content:center;
  transition:box-shadow .4s var(--ease);
}
.hb-frame img{width:100%; height:100%; object-fit:cover; display:block}
.hb-frame em{font-style:normal; font-size:9px; letter-spacing:.18em; text-transform:uppercase;
  color:rgba(34,48,42,.38); padding:0 10px; text-align:center; line-height:1.6}
.hb-frame.was{filter:saturate(.5) contrast(.95); opacity:.88}
.hb-iter-arrow{position:relative; width:clamp(28px,4vw,56px); height:2px; flex:0 0 auto;
  background:linear-gradient(90deg, rgba(34,48,42,.16), rgba(34,48,42,.4));
  transition:transform .4s var(--ease)}
.hb-iter-arrow::after{content:""; position:absolute; right:0; top:50%; width:9px; height:9px;
  border-top:2px solid rgba(34,48,42,.4); border-right:2px solid rgba(34,48,42,.4);
  transform:translateY(-50%) rotate(45deg)}
/* --- subtle before/after emphasis on hover, pointer devices only --- */
@media (hover:hover) and (pointer:fine){
  .hb-iter-row:has(.hb-iter-fig:hover) .hb-iter-fig{opacity:.55}
  .hb-iter-row:has(.hb-iter-fig:hover) .hb-iter-fig:hover{opacity:1}
  .hb-iter-row:has(.hb-iter-fig:hover) .hb-iter-fig:hover .hb-frame{
    box-shadow:0 20px 42px -20px rgba(32,58,78,.62), 0 0 0 1px rgba(255,255,255,1)}
  .hb-iter-row:has(.hb-iter-fig:hover) .hb-iter-fig:hover figcaption{opacity:1; color:var(--hb-ink)}
  .hb-iter-row:has(.hb-iter-fig.now:hover) .hb-iter-arrow,
  .hb-iter-row:hover .hb-iter-arrow{transform:translateX(3px)}
}
.hb-iter-note{margin:clamp(30px,4vh,42px) 0 0; font-size:14.5px; line-height:1.75;
  color:var(--hb-soft); max-width:70ch}
.hb-iter-note b{color:var(--hb-ink); font-weight:600}
/* three concise change points, side by side on desktop with thin dividers —
   never another card */
.hb-iter-compare{display:grid; grid-template-columns:repeat(3,minmax(0,1fr));
  gap:16px 0; margin:clamp(22px,3vh,30px) 0 0; padding-top:16px;
  border-top:1px solid rgba(34,48,42,.1)}
.hb-iter-compare > div{padding-left:18px; border-left:1px solid rgba(34,48,42,.1)}
.hb-iter-compare > div:first-child{padding-left:0; border-left:none}
.hb-iter-compare dt{margin:0; font-size:9.5px; letter-spacing:.2em;
  text-transform:uppercase; color:rgba(34,48,42,.42)}
.hb-iter-compare dd{margin:5px 0 0; font-size:12.5px; line-height:1.5; color:var(--hb-soft)}

/* ============================================================
   DESIGN GROWTH — full-width reflection, then a horizontal
   progression across the page (not a card, not an infographic)
   ============================================================ */
#hb-growth .hb-lead{max-width:none}

.hb-progress{margin-top:clamp(56px,7vh,84px)}
.hb-progress-row{display:flex; align-items:flex-start}
.hb-pg-stage{flex:0 0 auto; width:clamp(108px,13vw,158px); text-align:center}
.hb-pg-stage .zone{position:relative; display:block; height:30px; width:70px; margin:0 auto 16px}
.hb-pg-stage .zone i{position:absolute; top:50%; left:50%; width:6px; height:6px; border-radius:50%;
  margin:-3px 0 0 -3px; background:var(--earth-ink);
  transition:transform .6s var(--ease), opacity .6s var(--ease)}
/* stage one: loose, uneven, a little scattered */
.hb-pg-stage.s1 .zone i:nth-child(1){transform:translate(-17px,-6px) rotate(-8deg); opacity:.55}
.hb-pg-stage.s1 .zone i:nth-child(2){transform:translate(3px,7px) rotate(10deg); opacity:.8}
.hb-pg-stage.s1 .zone i:nth-child(3){transform:translate(16px,-4px) rotate(-4deg); opacity:.65}
/* stage two: settling into a loose, more deliberate row */
.hb-pg-stage.s2 .zone i:nth-child(1){transform:translate(-15px,-2px); opacity:.78}
.hb-pg-stage.s2 .zone i:nth-child(2){transform:translate(0,2px); opacity:.92}
.hb-pg-stage.s2 .zone i:nth-child(3){transform:translate(15px,-1px); opacity:.85}
/* stage three: resolved into a small, even system with its own baseline */
.hb-pg-stage.s3 .zone i{opacity:1}
.hb-pg-stage.s3 .zone i:nth-child(1){transform:translate(-14px,0)}
.hb-pg-stage.s3 .zone i:nth-child(2){transform:translate(0,0)}
.hb-pg-stage.s3 .zone i:nth-child(3){transform:translate(14px,0)}
.hb-pg-stage.s3 .zone::after{content:""; position:absolute; left:6px; right:6px;
  /* a baseline the dots rest above, never a line through them */
  top:calc(50% + 8px);
  height:1px; background:color-mix(in srgb, var(--earth-ink) 40%, transparent)}
.hb-pg-stage .label{font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  font-weight:600; color:var(--hb-ink); line-height:1.4}
/* the connector itself tells part of the story: a loose, uneven dashed rule
   settling into a clean, solid one as the progression resolves */
.hb-pg-link{flex:1 1 auto; padding-top:14px; min-width:36px}
.hb-pg-link .line{display:block; height:1px;
  background-image:repeating-linear-gradient(90deg,
    color-mix(in srgb, var(--earth-ink) 42%, transparent) 0 3px, transparent 3px 8px);
  opacity:.85}
.hb-pg-link:last-of-type .line{
  background-image:linear-gradient(90deg, color-mix(in srgb, var(--earth-ink) 50%, transparent), color-mix(in srgb, var(--earth-ink) 80%, transparent));
  opacity:1}
@media (max-width:900px){
  .hb-progress-row{flex-direction:column; align-items:stretch}
  .hb-pg-stage{width:auto; display:flex; align-items:center; gap:16px; text-align:left}
  .hb-pg-stage .zone{margin:0; flex:0 0 auto}
  .hb-pg-link{flex:0 0 auto; width:100%; padding:8px 0 8px 34px}
  .hb-pg-link .line{width:1px; height:32px;
    background-image:repeating-linear-gradient(180deg,
      color-mix(in srgb, var(--earth-ink) 42%, transparent) 0 3px, transparent 3px 8px)}
  .hb-pg-link:last-of-type .line{
    background-image:linear-gradient(180deg, color-mix(in srgb, var(--earth-ink) 50%, transparent), color-mix(in srgb, var(--earth-ink) 80%, transparent))}
}

/* ============================================================
   IF I WERE DESIGNING IT TODAY — four ideas, each with its own
   small drawing in the Sun / Sky / Earth palette
   ============================================================ */
/* always two by two, so four ideas never leave one card alone on a row */
.hb-ideas{display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
  gap:clamp(16px,2.2vw,28px); margin-top:clamp(40px,6vh,68px)}
@media (max-width:760px){ .hb-ideas{grid-template-columns:1fr} }
.hb-idea{
  position:relative; display:flex; flex-direction:column;
  padding:clamp(18px,2vw,24px) clamp(18px,2vw,24px) clamp(24px,2.8vw,34px);
  border-radius:18px;
  background:linear-gradient(165deg,
    color-mix(in srgb, var(--tint) 13%, #fff) 0%, rgba(255,255,255,.76) 62%);
  border:1px solid color-mix(in srgb, var(--tint) 24%, rgba(255,255,255,.9));
  box-shadow:0 20px 44px -26px rgba(32,58,78,.42);
  transition:transform .4s var(--ease), box-shadow .4s var(--ease);
}
.hb-idea:hover{transform:translateY(-3px); box-shadow:0 26px 52px -26px rgba(32,58,78,.5)}
/* the drawing sits in its own soft panel at the top of the card */
.hb-idea-art{
  position:relative; height:clamp(128px,15vw,158px); border-radius:12px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
  background:linear-gradient(160deg,
    color-mix(in srgb, var(--tint) 42%, #fff), color-mix(in srgb, var(--tint) 16%, #fff));
  border:1px solid rgba(255,255,255,.9);
  margin-bottom:clamp(20px,2.4vw,28px);
}
.hb-idea-art svg{display:block; width:auto; height:82%; max-width:92%; overflow:visible}
.hb-idea .num{display:block; font-size:10.5px; letter-spacing:.26em; color:var(--hb-soft); margin-bottom:10px}
.hb-idea h3{margin:0 0 10px; font-family:var(--serif); font-weight:600;
  font-size:clamp(22px,2.2vw,28px); line-height:1.2; color:var(--hb-ink)}
.hb-idea p{margin:0; font-size:15px; line-height:1.75; color:var(--hb-soft); max-width:52ch}

/* 01: a type specimen — the brand face, a serif and a sans side by side,
   over a small scale of text sizes */
.ia-type{display:flex; flex-direction:column; align-items:center; gap:12px}
.ia-type .ia-row{display:flex; align-items:baseline; gap:clamp(12px,1.6vw,18px); color:var(--hb-ink)}
.ia-type .a1{font-family:var(--brand); font-weight:700; font-size:clamp(34px,3.4vw,44px); line-height:1}
.ia-type .a2{font-family:var(--serif); font-style:italic; font-weight:600; font-size:clamp(32px,3.2vw,42px); line-height:1; opacity:.85}
.ia-type .a3{font-family:var(--sans); font-weight:500; font-size:clamp(24px,2.4vw,30px); line-height:1; opacity:.7}
.ia-type .scale{display:flex; flex-direction:column; align-items:center; gap:5px; width:clamp(120px,13vw,150px)}
.ia-type .scale i{display:block; height:5px; border-radius:3px; background:var(--sky-ink); opacity:.5}
.ia-type .scale i:nth-child(1){width:100%; height:7px; opacity:.62}
.ia-type .scale i:nth-child(2){width:72%}
.ia-type .scale i:nth-child(3){width:48%; height:4px; opacity:.38}

/* ============================================================
   PARALLAX DRIFT
   ============================================================ */
.hb-sec > .hb-drift{max-width:none; margin:0}
.hb-drift{position:absolute; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.hb-sec > div{position:relative; z-index:2}
.hb-drift span{position:absolute; will-change:transform}
.hb-drift .cloud{border-radius:100px; background:rgba(255,255,255,.5)}
.hb-drift .cloud::before, .hb-drift .cloud::after{
  content:""; position:absolute; bottom:0; border-radius:50%; background:inherit;
}
.hb-drift .cloud::before{left:14%; width:46%; height:172%}
.hb-drift .cloud::after{right:16%; width:34%; height:134%}
.hb-drift .spark{border-radius:50%;
  background:radial-gradient(closest-side circle, rgba(var(--hb-sun-rgb),.95), rgba(var(--hb-sun-rgb),0) 78%)}
.hb-drift .leaf{border-radius:82% 12% 82% 12%; background:rgba(var(--hb-earth-rgb),.7)}

/* ============================================================
   RESPONSIVE
   Width breakpoints reflow the layout; height breakpoints keep
   the bookcase — which is exactly one screen tall — from ever
   needing more room than the viewport has.
   ============================================================ */

/* ---- width ---- */

/* laptops: keep the case-study copy readable beside the phone cluster */
@media (max-width:1200px){
  .hb-hero-copy{flex:0 1 min(46%, 520px)}
  .hb-cluster{flex:0 1 min(48%, 520px)}
  /* the pods must shrink in step with the cluster's own reduced share of
     the row, or their fixed vh/px caps let them stay large enough to spill
     across the gap into the copy column */
  .hb-cluster .pod{width:min(27%, 15.5vh, 152px)}
  .hb-cluster .p2{width:min(33%, 18.5vh, 184px)}
  .cs-body{padding-inline:clamp(20px,5vw,48px)}
}

/* tablets */
@media (max-width:900px){
  /* shelf */
  .row.main{height:42vh}
  .nook{width:176px}
  .row-inner{padding:0 24px}
  .brand{width:38px; height:38px}
  .nav-links{gap:14px}
  .nav-link{font-size:10px; letter-spacing:.14em}
  .plaque{font-size:11px; letter-spacing:.16em}
  .menu{width:min(280px, calc(100vw - 36px)); right:-8px}
  .menu-name{font-size:14px}
  .menu-sub{font-size:10px}
  .cs-section{grid-template-columns:1fr; gap:14px}

  /* case study: the cluster drops under the copy, still centred */
  .hb-hero{
    flex-direction:column; align-items:flex-start;
    min-height:auto; padding-bottom:clamp(150px,24vh,230px);
  }
  .hb-hero{
    gap:clamp(14px, 3vh, 32px);
    padding:clamp(58px,9vh,104px) clamp(18px,5vw,44px) clamp(92px,14vh,156px);
  }
  .hb-hero-copy{flex:0 0 100%}
  .hb-mark{width:clamp(56px,9vw,80px); margin-bottom:clamp(20px,3.4vh,36px)}
  .hb-word2{font-size:clamp(34px, min(8vw, 7vh), 64px)}
  .hb-desc{max-width:44ch; white-space:normal; margin-top:clamp(14px,2.4vh,24px)}
  .hb-meta{gap:16px clamp(20px,4vw,34px); margin-top:clamp(20px,3.4vh,36px)}
  /* stacked: the phone group leaves absolute positioning behind and
     re-enters normal document flow as a plain flex row underneath the
     text. Its height is now derived entirely from its own children (no
     manual height formula to fall out of sync), and because it is just
     the next block after the copy — not layered over it — the two can
     never overlap. The same front/centre-and-back-and-sides composition
     is kept using bottom-alignment, size, and negative margins for the
     overlap, instead of transform:translate(). */
  .hb-cluster{
    flex:0 0 100%; align-self:auto; display:flex;
    align-items:flex-end; justify-content:center;
    --pw:min(30vw, 19vh, 168px);
    width:100%; margin-top:clamp(32px,5.5vh,58px); pointer-events:auto;
  }
  .hb-cluster .pod{
    position:relative; left:auto; top:auto;
    flex:0 0 auto; width:calc(var(--pw) * .78);
  }
  .hb-cluster .p1{
    transform:rotate(-6deg); margin:0 calc(var(--pw) * -.18) 5% 0;
  }
  .hb-cluster .p2{width:calc(var(--pw) * 1.1); transform:rotate(0deg); margin:0}
  .hb-cluster .p3{
    transform:rotate(6deg); margin:0 0 5% calc(var(--pw) * -.18);
  }
  .hb-car-stage{max-width:520px; padding:0 clamp(38px,7vw,52px)}
  .hb-car-track{max-width:228px}
  .hb-screens{gap:clamp(20px,5vw,48px)}
  .hb-pick{width:min(28vw, 170px)}

  /* four cycle steps side by side get too narrow to read below this, so the
     loop runs downward instead and every arrow turns with it */
  .hb-cycle{grid-template-columns:1fr; --cyc-gap:14px}
  .hb-cycle li:not(:last-child)::after{
    top:auto; right:auto; left:50%; bottom:calc(var(--cyc-gap) / -2 - 5px);
    transform:translateX(-50%) rotate(135deg);
  }
  .hb-loop{display:none}

  /* heard -> built reads top to bottom rather than across */
  .hb-bridge li{grid-template-columns:1fr; gap:14px}
  .hb-bridge .arw{width:2px; height:26px; justify-self:start; margin-left:4px;
    background:linear-gradient(180deg, rgba(34,48,42,.16), rgba(34,48,42,.42))}
  .hb-bridge .arw::after{right:auto; left:50%; top:auto; bottom:0;
    transform:translateX(-50%) rotate(135deg)}

  .hb-personas{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
  .hb-statement{font-size:clamp(30px,6.2vw,56px)}
  .hb-iter-row .hb-iter-fig{flex:0 1 clamp(150px,24vw,210px)}
  .hb-fnode{flex:0 0 clamp(96px,17vw,130px)}
  .hb-flow-alt li{flex:0 1 clamp(90px,17vw,124px)}
}

/* phones */
@media (max-width:620px){
  /* shelf */
  .hint{bottom:20px; font-size:9px; letter-spacing:.2em}
  .rail{bottom:46px; width:min(240px, 62vw)}
  .nook{width:158px}
  .panel .v-copy{padding:0 clamp(8px, 2.4vw, 16px)}
  .panel-hero .v-scroll{--sh:clamp(48px, 9vh, 92px)}
  .panel-sec  .v-scroll{--sh:clamp(62px, 13vh, 140px)}
  .brand{width:34px; height:34px}
  .brand-bubble{width:min(270px, calc(100vw - 28px)); padding:16px 17px 14px}
  .rec-book{font-size:15px}
  .rec-note{min-height:52px}
  .nav{padding:0 14px}
  .nav-links{gap:11px}
  .nav-link{font-size:9.5px; letter-spacing:.1em}
  .menu{width:min(260px, calc(100vw - 28px))}

  /* case study */
  .cs-hydra{--hb-sec-y:clamp(56px,10vh,96px)}
  .hb-sec{padding:var(--hb-sec-y) 20px}
  .hb-cluster{--pw:min(28vw, 18vh, 152px)}
  .hb-tabs button{padding:11px 16px; font-size:11px; letter-spacing:.1em}
  .hb-row{padding:22px 20px}
  .hb-intro-card{min-height:clamp(220px,34vh,320px); padding:clamp(52px,9vh,84px) 20px}
  .hb-screens{gap:18px}
  .hb-pick{width:min(40vw, 168px)}
  .hb-car-stage{padding:0 clamp(34px,9vw,46px)}
  .hb-car-track{max-width:190px}
  .hb-car-slot.is-prev{transform:translateX(-52%) scale(.74)}
  .hb-car-slot.is-next{transform:translateX(52%) scale(.74)}
  .hb-car-nav{width:32px; height:32px}
  .cs-body{padding-inline:20px}
  /* before and after stack, so neither frame is squeezed */
  .hb-iter-row{flex-direction:column; gap:14px}
  .hb-iter-row .hb-iter-fig{flex:0 1 auto; width:min(62vw, 230px)}
  .hb-iter-arrow{width:2px; height:26px;
    background:linear-gradient(180deg, rgba(34,48,42,.16), rgba(34,48,42,.4))}
  .hb-iter-arrow::after{right:auto; left:50%; top:auto; bottom:0;
    transform:translateX(-50%) rotate(135deg)}
  /* three change points stack too, with a top divider instead of a side one */
  .hb-iter-compare{grid-template-columns:1fr; gap:14px}
  .hb-iter-compare > div{padding-left:0; border-left:none;
    padding-top:14px; border-top:1px solid rgba(34,48,42,.1)}
  .hb-iter-compare > div:first-child{padding-top:0; border-top:none}
}

/* very narrow */
@media (max-width:400px){
  .nook{width:142px}
  .hb-personas{grid-template-columns:1fr}
  .hb-persona .who{gap:12px}
  .hb-avatar{width:46px; height:46px; font-size:19px}
  .hb-cycle li{padding:20px}
  .hb-iter{padding:20px}
  .hb-iter-row .hb-iter-fig{width:min(74vw, 210px)}
  .hb-cluster{--pw:min(26vw, 17vh, 136px)}
  .hb-trio, .hb-cards{grid-template-columns:1fr}
  .hb-meta{gap:13px 18px}
  .hb-meta dt{letter-spacing:.18em}
  .hb-desc{max-width:100%}
  .hb-hero{padding-bottom:clamp(120px,20vh,170px)}
  .hb-screens{flex-direction:column; align-items:center}
  .hb-pick{width:min(58vw, 200px)}
}

/* ---- height ----
   the bookcase is one screen tall, so its rows step down rather
   than overflow as vertical room disappears */
/* wide but short: the row layout stays, so the phones take their cue from
   the height that is actually left between the padding */
/* short-but-wide windows only — below 900px width the cluster is already
   in normal flow and sized from --pw instead */
@media (max-height:640px) and (min-width:901px){
  .hb-cluster .pod{width:min(29%, 15.5vh, 190px)}
  .hb-cluster .p2{width:min(35%, 18.5vh, 228px)}
}
@media (max-height:720px){
  .plaque{font-size:11px; padding:5px 6px}
  .nook-frame{padding-bottom:34px}
  .nook-arch{inset:12px 14px 34px}
  .nook-caption{bottom:34px}
  .row.upper, .row.lower{min-height:84px}
  .row.main{min-height:210px}
}
@media (max-height:600px){
  .panel-hero .v-scroll{--sh:clamp(40px, 8vh, 74px)}
  .panel-sec  .v-scroll{--sh:clamp(52px, 12vh, 108px)}
  .row.upper, .row.lower{min-height:60px}
  .row.main{height:46vh; min-height:170px}
  .board{min-height:11px}
  .board.thick{min-height:13px}
  .nook{width:168px}
  .plaque{font-size:10px; letter-spacing:.14em; padding:4px 5px; bottom:7px}
  .nook-frame{padding:9px 11px 28px}
  .nook-arch{inset:9px 11px 28px; border-radius:56px 56px 4px 4px}
  .nook[data-project="hydrabloom"] .nook-frame,
  .nook[data-project="lantern"] .nook-frame{border-radius:67px 67px 3px 3px / 65px 65px 3px 3px}
  .nook-caption{bottom:28px; padding:20px 8px 8px}
  .rail{bottom:40px}
  .hint{bottom:14px}
}
/* landscape phones: almost no vertical room at all */
@media (max-height:460px){
  /* landscape phones: let the hero be as tall as its contents need */
  .hb-hero{
    min-height:auto;
    padding:clamp(38px,8vh,64px) clamp(18px,5vw,44px) clamp(56px,11vh,96px);
  }
  .hb-mark{margin-bottom:clamp(14px,3vh,24px)}
  .panel-hero .v-scroll, .panel-sec .v-scroll{--sh:clamp(34px, 11vh, 62px)}
  .row.upper, .row.lower{min-height:0; flex:1}
  .row.main{height:52vh; min-height:130px}
  .nook{width:132px}
  .nook-frame{padding:7px 8px 22px}
  .nook-arch{inset:7px 8px 22px; border-radius:40px 40px 3px 3px}
  .nook[data-project="hydrabloom"] .nook-frame,
  .nook[data-project="lantern"] .nook-frame{border-radius:48px 48px 3px 3px / 47px 47px 3px 3px}
  .nook-caption{display:none}
  .plaque{font-size:9px; bottom:5px; padding:3px 4px}
  .display{font-size:clamp(20px,2.2vw,30px)}
  .lede{display:none}
  .hb-cluster{--pw:min(22vw, 32vh, 200px)}
}

@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>

<body>

<header class="nav">
  <div class="brand-wrap">
    <button class="brand" id="avatar" aria-label="Janet Sanchez — say hello"
            aria-expanded="false" aria-controls="brandBubble">
      <span class="avatar-ph" aria-hidden="true"></span>
    </button>
    <div class="brand-bubble" id="brandBubble" role="dialog" aria-labelledby="recTitle" hidden>
      <form class="rec" id="recForm" novalidate>
        <span class="sig" id="recTitle">What should I read next?</span>
        <p>My shelf could always use another book. Leave me a recommendation.</p>
        <label class="rec-field">
          <span class="rec-label">Book title</span>
          <input class="rec-input rec-book" id="recBook" name="book" type="text"
                 placeholder="What should I read?" autocomplete="off" maxlength="140" required>
        </label>
        <label class="rec-field">
          <span class="rec-label">A little note <i>(optional)</i></span>
          <textarea class="rec-input rec-note" id="recNote" name="note" rows="2"
                    placeholder="Tell me what you loved about it..." maxlength="600"></textarea>
        </label>
        <button class="rec-send" type="submit">Add to my shelf <span aria-hidden="true">→</span></button>
      </form>
      <div class="rec-done" id="recDone" hidden>
        <div class="rec-shelf" aria-hidden="true">
          <i class="rb rb1"></i><i class="rb rb2"></i><i class="rb rb3"></i>
          <i class="rb rb-new"></i>
          <i class="rb rb4"></i>
          <b class="rec-board"></b>
        </div>
        <p class="rec-thanks" role="status" aria-live="polite">
          <span class="sig">Added to the shelf <span aria-hidden="true">✦</span></span>
          Thanks for the recommendation!
        </p>
      </div>
    </div>
  </div>
  <nav class="nav-links" aria-label="Sections of the bookshelf">
    <div class="nav-item">
      <button class="nav-link" id="workBtn" aria-haspopup="true" aria-expanded="false" aria-controls="workMenu">
        Work <span class="caret" aria-hidden="true"></span>
      </button>
      <div class="menu" id="workMenu" role="menu" aria-label="Jump to a project" hidden></div>
    </div>
    <button class="nav-link" data-go="about">About</button>
    <a class="nav-link" href="images/Janet%20Sanchez%20-%20Resume.pdf" target="_blank" rel="noopener noreferrer">Résumé</a>
    <button class="nav-link" data-go="contact">Contact</button>
  </nav>
</header>

<main id="stage" aria-label="Interactive bookshelf. Use arrow keys or drag to explore.">
  <div class="layer" id="wall" aria-hidden="true"></div>
  <div class="layer" id="track">
    <div class="case" id="case">
      <div class="row deco upper" id="rowUpperWrap" aria-hidden="true"><div class="row-inner" id="rowUpper"></div></div>
      <div class="board" id="boardA" aria-hidden="true"></div>
      <div class="row main" id="rowMainWrap"><div class="row-inner" id="rowMain"></div></div>
      <div class="board thick" id="boardB" aria-hidden="true"></div>
      <div class="row deco lower" aria-hidden="true"><div class="row-inner" id="rowLower"></div></div>
    </div>
  </div>
  <div class="layer" id="fore" aria-hidden="true"></div>
</main>

<div id="topFade" aria-hidden="true"></div>

<p class="hint" id="hint"><i aria-hidden="true"></i>scroll to walk the shelf<span>or drag</span></p>

<div class="rail" id="rail" role="group" aria-label="Position along the shelf">
  <div class="rail-track"></div>
  <div class="rail-thumb" id="railThumb"></div>
</div>

<button class="back" type="button" id="backBtn" hidden>← Back to shelf</button>
<section id="overlay" hidden aria-modal="true" role="dialog" aria-labelledby="csTitle"></section>

<script>
(function(){
"use strict";

const REDUCE = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---- PROFILE PHOTO -------------------------------------------------------
   Put your picture here — a file path ("me.jpg"), a full URL, or a data URI.
   Leave it empty and the avatar shows a placeholder silhouette instead.
   A square image works best; it is cropped to a circle.                     */
const AVATAR_SRC = "images/hydrabloom/grad.jpg";
if (AVATAR_SRC){
  const av = document.getElementById("avatar");
  const img = document.createElement("img");
  img.className = "avatar-img";
  img.src = AVATAR_SRC;
  img.alt = "";
  img.decoding = "async";
  av.appendChild(img);
  av.classList.add("has-photo");
}

/* ---- NOOK ARTWORK --------------------------------------------------------
   Put an image path or URL against a project and it replaces that nook's
   CSS scene entirely — no other changes needed.

     nook  the picture inside the shelf opening. Tall and narrow (roughly
           2:5). This is the one that matters most.
     hero  the wide banner at the top of that project's case study. Leave it
           empty and the nook image is used there too.
     pos   optional framing, same syntax as CSS object-position, e.g.
           "center", "50% 30%", "top". Handy when a cover crop cuts off
           the part you care about.
     crop  optional [x0, y0, x1, y1, width, height] in the source image's own
           pixels. Only that rectangle is ever shown: it is scaled to cover
           the opening and centred, so anything outside it (a painted frame,
           a background) can never appear, whatever shape the opening takes.

   Anything left empty keeps the built-in CSS scene. If a file is missing or
   fails to load, the CSS scene comes back automatically, so a broken path
   never leaves an empty hole in the shelf.                                  */
const ART = {
  /* the PNG carries its own black ground and beige arch; the crop keeps to
     the greenhouse interior, set far enough inside that the nook's rounder
     or squarer corners at every breakpoint still land on the painting */
  hydrabloom: {nook:"images/hydrabloom/hydrabloom%20arch.png", hero:"", pos:"center",
               crop:[264, 140, 760, 1450, 1024, 1536]},
  lantern:    {nook:"", hero:"", pos:"center"}
};

function artMarkup(src, pos, crop){
  if (crop){
    /* the box has the crop's proportions and covers the opening; the image
       is sized and offset inside it so the crop rectangle fills the box */
    const cw = crop[2] - crop[0], ch = crop[3] - crop[1];
    const pct = function(n){ return (n * 100).toFixed(4) + "%"; };
    return '<div class="scene sc-art art-crop">'
         + '<div class="art-box" style="--crop-ratio:' + (cw / ch).toFixed(5) + '">'
         + '<img class="art-img" src="' + src + '" alt="" aria-hidden="true" style="'
         +   'width:' + pct(crop[4] / cw) + ';height:' + pct(crop[5] / ch)
         +   ';left:' + pct(-crop[0] / cw) + ';top:' + pct(-crop[1] / ch) + '">'
         + '</div></div>';
  }
  return '<div class="scene sc-art">'
       + '<img class="art-img" src="' + src + '" alt="" aria-hidden="true"'
       + (pos ? ' style="--art-pos:' + pos + '"' : '') + '>'
       + '</div>';
}

/* the picture for a project, falling back through hero -> nook -> CSS scene */
function sceneMarkup(id, which){
  const a = ART[id] || {};
  const src = which === "hero" ? (a.hero || a.nook) : a.nook;
  return src ? artMarkup(src, a.pos, a.crop) : SCENES[PROJECTS[id].scene]();
}

/* if the file is missing, quietly put the CSS scene back */
function wireArt(root, id){
  root.querySelectorAll(".art-img").forEach(function(img){
    img.addEventListener("error", function(){
      const host = img.closest(".scene");
      if (host) host.outerHTML = SCENES[PROJECTS[id].scene]();
    });
  });
}

/* seeded rng — the shelf is identical on every load */
function rngFactory(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rand = rngFactory(70413);
const pick = a => a[Math.floor(rand()*a.length)];
const between = (a,b) => a + rand()*(b-a);
const ri = (a,b) => Math.round(between(a,b));
const r2 = n => Math.round(n*100)/100;

/* ============================================================
   1 — BOOK CONSTRUCTION
   ============================================================ */
/* the upper and lower rows are blurred and dimmed, so they get plain spines —
   full texture there would cost thousands of nodes nobody can see */
let simpleMode = false;

/* raised hubs are the loudest treatment on the shelf, so only a handful of
   volumes get them. everything else carries gilt rules, a pasted label,
   or nothing at all beyond the material itself. */
let bandsBudget = 9;

/* the top shelf runs off the frame, so its volumes are oversized — their heads
   are cut by the edge the way the bottom shelf's tails are */
let heightScale = 1;

function makeBook(o){
  o = o || {};
  const col = o.col || P[pick(Object.keys(P))];
  const w = o.w || ri(15,36);
  const h = r2((o.h || ri(58,92)) * heightScale);
  const el = document.createElement("div");
  el.className = "book m-" + col.m;
  el.style.width = r2(w * (heightScale > 1 ? 1.22 : 1)) + "px";
  el.style.height = h + "%";
  el.style.setProperty("--c", col.c);
  el.style.setProperty("--l", col.l);
  el.style.setProperty("--d", col.d);
  if (o.depth === "fwd") el.classList.add("fwd");
  if (o.depth === "bck") el.classList.add("bck");
  if (o.tilt){
    /* tips to the right, off its own bottom-left corner; fixLeans() reserves
       the horizontal sweep as margin so it never crosses its neighbour */
    el.classList.add("lean");
    el.dataset.tilt = o.tilt;
    el.dataset.h = h;
    el.style.transform = "rotate(" + o.tilt + "deg)";
  }
  if (simpleMode) return el;

  /* not every binding is coarse — about a third are smooth, a third lightly
     grained, a third full material texture */
  const finish = o.finish || (rand() < .34 ? "none" : (rand() < .5 ? "soft" : "full"));
  let out = finish === "none" ? "" :
    '<span class="grain' + (finish === "soft" ? " soft" : "") + '"></span>';

  let style = o.style || "plain";
  if (style === "bands"){
    if (bandsBudget > 0) bandsBudget--;
    else style = rand() < .5 ? "gilt" : "plain";
  }

  if (style === "bands"){
    const n = ri(3,5), top = 12, span = 74, pitch = span/(n-1);
    for (let i=0;i<n;i++) out += '<span class="band" style="top:' + r2(top + pitch*i) + '%"></span>';
  } else if (style === "gilt"){
    /* two fine rules at the head, two at the tail */
    out += '<span class="rule" style="top:11%"></span><span class="rule" style="top:13.5%"></span>'
         + '<span class="rule" style="bottom:11%"></span><span class="rule" style="bottom:13.5%"></span>';
  }

  if (finish !== "none" && col.m !== "paper" && rand() < .3){
    for (let i=0;i<ri(2,5);i++){
      const sz = between(1.5,3.5);
      out += '<span class="fox" style="left:' + r2(between(8,80)) + '%;top:' + r2(between(6,92)) + '%;'
           + 'width:' + r2(sz) + 'px;height:' + r2(sz) + 'px"></span>';
    }
  }
  out += '<span class="wear"></span>';
  el.innerHTML = out;
  return el;
}

function makeStack(o){
  o = o || {};
  const el = document.createElement("div");
  el.className = "stack";
  const n = o.n || ri(3,6);
  const k = heightScale > 1 ? 1.22 : 1;
  const base = (o.w || ri(58,86)) * k;
  for (let i=0;i<n;i++){
    const col = P[pick(Object.keys(P))];
    const b = document.createElement("i");
    b.style.height = r2(ri(9,15) * k) + "px";
    b.style.width = r2(Math.max(38, base - i*ri(0,7))) + "px";
    b.style.marginLeft = ri(0,9) + "px";
    b.style.background = "linear-gradient(90deg," + col.d + "," + col.c + " 22%," + col.l + " 55%," + col.d + ")";
    el.appendChild(b);
  }
  el.style.width = r2(base + 10) + "px";
  return el;
}

function spacer(w){ const d = document.createElement("div"); d.className = "gap"; d.style.width = w + "px"; return d; }

/* ============================================================
   2 — SHELF RUNS (hand-composed, not generated)
   Each entry is a real arrangement you'd find on a used shelf.
   ============================================================ */
const RUNS = {
  /* a matched multi-volume set — same binding, same height, one pulled proud */
  set: function(host, n, key){
    const col = P[key || pick(["oxblood","bottle","midnight","chestnut","tan"])];
    const w = ri(19,25), h = ri(76,88);
    const proud = ri(0, n-1);
    const style = rand() < .3 ? "bands" : "gilt";
    for (let i=0;i<n;i++){
      host.appendChild(makeBook({col, w, h: h + (i === n-1 ? -2 : 0), style,
        depth: i === proud ? "fwd" : null}));
    }
  },
  /* mismatched clutter, occasionally with one volume tipped over */
  jumble: function(host, n){
    for (let i=0;i<n;i++){
      const lean = (i === n-2) && rand() < .4;
      host.appendChild(makeBook({
        w: ri(14,34), h: ri(58,88),
        style: pick(["plain","plain","gilt","plain","gilt","plain","plain"]),
        tilt: lean ? ri(5,9) : 0,
        depth: rand() < .18 ? (rand() < .5 ? "fwd" : "bck") : null
      }));
    }
  },
  /* a run of tall thin folios, standing straight and tightly packed */
  folios: function(host, n){
    for (let i=0;i<n;i++){
      host.appendChild(makeBook({
        col:P[pick(["dust","linen","slate","teal"])],
        w: ri(11,18), h: ri(86,96), style: rand() < .5 ? "gilt" : "plain",
        finish: rand() < .5 ? "none" : "soft"
      }));
    }
  },
  /* short, pale, smooth-bound volumes */
  paperbacks: function(host, n){
    for (let i=0;i<n;i++){
      host.appendChild(makeBook({
        col:P[pick(["ivory","linen","brick","ice","dust"])],
        w: ri(9,17), h: ri(54,70), style:"plain",
        finish: rand() < .6 ? "none" : "soft"
      }));
    }
  },
  /* a gap where something was taken out — the survivor leans into the space */
  breach: function(host){
    host.appendChild(makeBook({w:ri(20,28), h:ri(70,84), style:"bands", tilt:ri(7,11)}));
    host.appendChild(spacer(ri(12,24)));
    host.appendChild(makeBook({w:ri(16,24), h:ri(64,80), style:"plain", depth:"bck"}));
  },
  /* books laid flat */
  flat: function(host){
    host.appendChild(makeStack({n:ri(3,6)}));
  },
  /* two heavy folios pressed together, pushed to the back */
  pressed: function(host){
    const col = P[pick(["chestnut","oxblood","tan"])];
    host.appendChild(makeBook({col, w:ri(30,40), h:ri(84,94), style:"bands", depth:"bck"}));
    host.appendChild(makeBook({col, w:ri(26,36), h:ri(80,90), style:"gilt", depth:"bck"}));
  },
  /* one book pulled forward, alone, like it's mid-read */
  proud: function(host){
    host.appendChild(makeBook({w:ri(22,30), h:ri(72,86), style:"gilt", depth:"fwd"}));
  }
};

/* the sequences below are written out deliberately so the rhythm reads
   as arrangement rather than output. gaps are irregular on purpose. */
const SEQ_A = [["jumble",5],["flat"],["set",4],["gap",9],["folios",3],["paperbacks",4],
               ["breach"],["jumble",4],["pressed"],["gap",5],["paperbacks",3],["proud"],["jumble",3]];
const SEQ_B = [["gap",7],["set",6,"bottle"],["jumble",4],["breach"],["flat"],["paperbacks",5],
               ["gap",11],["folios",4],["jumble",6],["pressed"],["paperbacks",3],["gap",6],
               ["set",3,"tan"],["jumble",5],["proud"],["flat"],["jumble",4]];
const SEQ_C = [["jumble",4],["paperbacks",4],["gap",8],["set",5,"midnight"],["breach"],
               ["folios",3],["flat"],["jumble",5],["pressed"],["gap",5],["paperbacks",4],["jumble",3]];
const SEQ_D = [["folios",4],["jumble",5],["flat"],["gap",10],["set",4,"oxblood"],["paperbacks",3],
               ["breach"],["jumble",4],["proud"],["pressed"],["jumble",5],["paperbacks",4],["flat"]];
const SEQ_E = [["jumble",4],["set",3,"chestnut"],["gap",7],["paperbacks",4],["flat"],["folios",3],
               ["jumble",5],["breach"],["pressed"],["jumble",4]];

function runSeq(host, seq){
  seq.forEach(function(step){
    if (step[0] === "gap"){ host.appendChild(spacer(step[1])); return; }
    RUNS[step[0]](host, step[1], step[2]);
  });
}
